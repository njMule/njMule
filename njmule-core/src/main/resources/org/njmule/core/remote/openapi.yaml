                  $ref: "#/components/schemas/HostPort"
      responses:
        "200":
          $ref: "#/components/responses/Ok"
        "400":
          $ref: "#/components/responses/BadRequest"
        default:
          $ref: "#/components/responses/Error"
  /servers/disconnect:
    post:
      operationId: disconnectServer
      tags: [servers]
      summary: Leaves the server.
      responses:
        "200":
          $ref: "#/components/responses/Ok"
        default:
          $ref: "#/components/responses/Error"
  /servers/import:
    post:
      operationId: importServers
      tags: [servers]
      summary: Adds the servers of a server.met file at an address.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebList"
      responses:
        "200":
          $ref: "#/components/responses/Added"
        "400":
          $ref: "#/components/responses/BadRequest"
        default:
          $ref: "#/components/responses/Error"
  /servers/{address}:
    parameters:
      - name: address
        in: path
