        schema:
          $ref: "#/components/schemas/HostPort"
    delete:
      operationId: removeServer
      tags: [servers]
      summary: Forgets a server.
      responses:
        "200":
          $ref: "#/components/responses/Ok"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"

  /servers/lists:
    get:
      operationId: getServerLists
      tags: [servers]
      summary: The addresses of the server lists taken again at each start, when the preferences ask.
      responses:
        "200":
          description: The addresses.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServerLists"
        default:
          $ref: "#/components/responses/Error"
    put:
      operationId: setServerLists
      tags: [servers]
      summary: Replaces the addresses of the server lists.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServerLists"
      responses:
        "200":
          description: The addresses as they are now.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServerLists"
        "400":
          $ref: "#/components/responses/BadRequest"
        default:
          $ref: "#/components/responses/Error"
  /servers/{address}/priority:
    parameters:
      - $ref: "#/components/parameters/ServerAddress"
    put:
      operationId: setServerPriority
      tags: [servers]
      summary: Sets the priority of a server.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [priority]
              properties:
                priority:
                  type: string
                  enum: [low, normal, high]
      responses:
        "200":
          $ref: "#/components/responses/Ok"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
  /servers/{address}/static:
    parameters:
      - $ref: "#/components/parameters/ServerAddress"
    put:
      operationId: setStaticServer
      tags: [servers]
      summary: Puts a server in the static list, or takes it out.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [static]
              properties:
                static:
                  type: boolean
      responses:
        "200":
          $ref: "#/components/responses/Ok"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
  /notifications/test:
    post:
      operationId: testNotifications
      tags: [engine]
      summary: Sends a test message through each notification channel that is on, and tells how each went.
      responses:
        "200":
          description: One entry for each channel that is on; none when no channel is.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [channel, sent]
                  properties:
                    channel:
                      type: string
                      enum: [email, webhook]
                    sent:
                      type: boolean
                    error:
                      type: string
                      description: Why the message was not sent.
        default:
          $ref: "#/components/responses/Error"
  /ports/test:
    get:
      operationId: getPortTest
      tags: [engine]
      summary: The last test of the ports, or null before the first.
      responses:
        "200":
          description: The test as far as it went.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/PortTest"
                  - type: "null"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: testPorts
      tags: [engine]
      summary: Tests the ports, asking the router through UPnP and a server or Kad whether others reach them.
      description: The test goes on after the answer; read it again until done.
      responses:
        "202":
          description: The test as it started.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortTest"
        default:
          $ref: "#/components/responses/Error"
  /kad:
    get:
      operationId: getKad
      tags: [kad]
      summary: The state of Kad.
      responses:
        "200":
          description: The state of Kad, or null while it is off.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Kad"
                  - type: "null"
        default:
          $ref: "#/components/responses/Error"
  /kad/contacts:
    get:
      operationId: listKadContacts
      tags: [kad]
      summary: The contacts of the routing table.
      responses:
        "200":
          description: Every contact.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/KadContact"
        default:
          $ref: "#/components/responses/Error"
  /kad/searches:
    get:
      operationId: listKadSearches
      tags: [kad]
      summary: The Kad lookups running now.
      responses:
        "200":
          description: Every lookup.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/KadSearch"
        default:
          $ref: "#/components/responses/Error"
  /kad/connect:
    post:
      operationId: connectKad
      tags: [kad]
      summary: Joins Kad.
      responses:
        "200":
          $ref: "#/components/responses/Ok"
        default:
          $ref: "#/components/responses/Error"
  /kad/disconnect:
    post:
      operationId: disconnectKad
      tags: [kad]
      summary: Leaves Kad.
      responses:
        "200":
          $ref: "#/components/responses/Ok"
        default:
          $ref: "#/components/responses/Error"
  /kad/recheck:
    post:
      operationId: recheckKadFirewall
      tags: [kad]
      summary: Checks again whether other Kad nodes can reach us.
      responses:
        "200":
          $ref: "#/components/responses/Ok"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/Error"
  /kad/bootstrap:
    post:
      operationId: bootstrapKad
      tags: [kad]
      summary: Joins Kad through a node.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddressBody"
      responses:
        "200":
          $ref: "#/components/responses/Ok"
        "400":
          $ref: "#/components/responses/BadRequest"
        default:
          $ref: "#/components/responses/Error"
  /kad/nodes:
    post:
      operationId: importKadNodes
      tags: [kad]
      summary: Adds the contacts of a nodes.dat file at an address.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebList"
      responses:
        "200":
          $ref: "#/components/responses/Added"
        "400":
          $ref: "#/components/responses/BadRequest"
        default:
          $ref: "#/components/responses/Error"

  /searches:
    get:
      operationId: listSearches
      tags: [searches]
      summary: The searches started through the API or the web pages whose results are kept, oldest first.
      responses:
        "200":
          description: The searches.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, query, scope, running, results]
                  properties:
                    id:
                      $ref: "#/components/schemas/SearchId"
                    query:
                      type: string
                      description: What was searched for; empty for a search whose start was not noted.
                    scope:
                      type: string
                      description: Where it was searched, as asked; empty when not noted.
                    running:
                      type: boolean
                      description: Whether more results may come.
                    results:
                      type: integer
                      minimum: 0
                      description: The results kept so far.
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: startSearch
      tags: [searches]
      summary: Starts a search; its results gather as they come.
      description: The results of the last ten searches started through the API or the web pages are kept.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query]
              properties:
                query:
                  type: string
                  minLength: 1
                  description: Words, with AND, OR and NOT between them as wanted.
                scope:
                  $ref: "#/components/schemas/SearchScope"
      responses:
        "201":
          description: The search started.
          content:
            application/json:
              schema:
                type: object
                required: [id]
                properties:
                  id:
                    $ref: "#/components/schemas/SearchId"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: Automatic was asked, and neither a server nor Kad is connected.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          $ref: "#/components/responses/Error"
  /searches/saved:
    get:
      operationId: listSavedSearches
      tags: [searches]
      summary: The search tabs left open at the last exit, when the preferences keep them.
      responses:
        "200":
          description: The searches kept, with their results.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SavedSearch"
        default:
          $ref: "#/components/responses/Error"
    put:
      operationId: saveSearches
      tags: [searches]
      summary: Keeps these searches for the next start, in place of those kept before.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/SavedSearch"
      responses:
        "200":
          $ref: "#/components/responses/Ok"
        "400":
          $ref: "#/components/responses/BadRequest"
        default:
          $ref: "#/components/responses/Error"
  /searches/spam:
    get:
      operationId: getSpamMarks
      tags: [searches]
      summary: The files marked as spam or as not spam, and the names of those marked spam.
      responses:
        "200":
          description: The marks so far.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpamMarks"
        default:
          $ref: "#/components/responses/Error"
  /searches/{id}:
    parameters:
      - $ref: "#/components/parameters/SearchId"
    get:
      operationId: getSearchResults
      tags: [searches]
      summary: The results of a search, those with the most sources first and spam last.
      description: Their spam ratings are those of the files marked so far.
      responses:
        "200":
          description: The results so far.
          content:
            application/json:
              schema:
                type: object
                required: [id, running, results]
                properties:
                  id:
                    $ref: "#/components/schemas/SearchId"
                  running:
                    type: boolean
                    description: Whether more results may come.
                  results:
                    type: array
                    items:
                      $ref: "#/components/schemas/SearchResult"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: stopSearch
      tags: [searches]
      summary: Stops a search and forgets its results.
      responses:
        "200":
          $ref: "#/components/responses/Ok"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
  /searches/{id}/spam:
    parameters:
      - $ref: "#/components/parameters/SearchId"
    post:
      operationId: markSpam
      tags: [searches]
      summary: Marks results as spam, or as not spam; every search is rated again by the marks.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [hashes]
              properties:
                hashes:
                  type: array
                  minItems: 1
                  maxItems: 1000
                  items:
                    $ref: "#/components/schemas/Hash"
                spam:
                  type: boolean
                  default: true
      responses:
        "200":
          $ref: "#/components/responses/Ok"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
  /searches/{id}/more:
    parameters:
      - $ref: "#/components/parameters/SearchId"
    post:
      operationId: moreSearchResults
      tags: [searches]
      summary: Asks more servers for results of a server search.
      responses:
        "200":
          $ref: "#/components/responses/Ok"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/Error"
  /searches/{id}/download:
    parameters:
      - $ref: "#/components/parameters/SearchId"
    post:
      operationId: downloadSearchResult
      tags: [searches]
      summary: Downloads a result of a search.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [hash]
              properties:
                hash:
                  $ref: "#/components/schemas/Hash"
      responses:
        "201":
          $ref: "#/components/responses/Download"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
  /categories:
    get:
      operationId: listCategories
      tags: [downloads]
      summary: The categories of downloads.
      responses:
        "200":
          description: Every category.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"
        default:
          $ref: "#/components/responses/Error"
    put:
      operationId: setCategories
      tags: [downloads]
      summary: Replaces the categories; the downloads of one removed fall into none.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              maxItems: 1000
              items:
                type: object
                required: [id, name]
                properties:
                  id:
                    $ref: "#/components/schemas/CategoryId"
                  name:
                    type: string
                  incoming:
                    type: [string, "null"]
                  comment:
                    type: string
                  priority:
                    $ref: "#/components/schemas/DownloadPriority"
                  color:
                    type: integer
                    minimum: 0
                    maximum: 8
                  patterns:
                    type: string
                  regex:
                    type: boolean
      responses:
        "200":
          description: The categories as they are now.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"
        "400":
          $ref: "#/components/responses/BadRequest"
        default:
          $ref: "#/components/responses/Error"

  /friends:
    get:
      operationId: listFriends
      tags: [social]
      summary: The friends.
      responses:
        "200":
          description: Every friend.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Friend"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: addFriend
      tags: [social]
      summary: Adds a friend, or renames one known by the user hash.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userHash, name]
              properties:
                userHash:
                  $ref: "#/components/schemas/Hash"
                name:
                  type: string
                  maxLength: 255
                address:
                  $ref: "#/components/schemas/HostPort"
      responses:
        "200":
          $ref: "#/components/responses/Ok"
        "400":
          $ref: "#/components/responses/BadRequest"
        default:
          $ref: "#/components/responses/Error"
  /friends/{userHash}:
    parameters:
      - name: userHash
        in: path
        required: true
        description: The user hash of the friend.
        schema:
          $ref: "#/components/schemas/Hash"
    delete:
      operationId: removeFriend
      tags: [social]
      summary: Removes a friend.
      responses:
        "200":
          $ref: "#/components/responses/Ok"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
  /friends/slot:
    get:
      operationId: getFriendSlot
      tags: [social]
      summary: The friend who has the upload slot kept for a friend, if one has.
      responses:
        "200":
          description: The friend's user hash, or null.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FriendSlot"
        default:
          $ref: "#/components/responses/Error"
    put:
      operationId: setFriendSlot
      tags: [social]
      summary: Gives the friend slot to a friend, or to nobody with null.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FriendSlot"
      responses:
        "200":
          description: The slot as it is now.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FriendSlot"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
  /conversations:
    get:
      operationId: listConversations
      tags: [social]
      summary: The chats of this run, the one with the newest line first.
      description: >-
        Up to 1000 lines a chat; of the clients that wrote and were never answered, the 50 newest
        are kept.
      responses:
        "200":
          description: Every chat.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Conversation"
        default:
          $ref: "#/components/responses/Error"
  /conversations/{address}:
    parameters:
      - name: address
        in: path
        required: true
        description: The client's address, as the chat gives it.
        schema:
          $ref: "#/components/schemas/HostPort"
    delete:
      operationId: closeConversation
      tags: [social]
      summary: Forgets a chat.
      responses:
        "200":
          $ref: "#/components/responses/Ok"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
  /messages:
    post:
      operationId: sendMessage
      tags: [social]
      summary: Sends a chat message to a client.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to, text]
              properties:
                to:
                  $ref: "#/components/schemas/HostPort"
                text:
                  type: string
                  minLength: 1
      responses:
        "200":
          $ref: "#/components/responses/Ok"
        "400":
          $ref: "#/components/responses/BadRequest"
        default:
          $ref: "#/components/responses/Error"
  /bans:
    get:
      operationId: listBans
      tags: [social]
      summary: The clients banned now.
      responses:
        "200":
          description: Every ban.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Ban"
        default:
          $ref: "#/components/responses/Error"
  /bans/{address}:
    parameters:
      - name: address
        in: path
        required: true
        description: The banned client's address, as the list of bans gives it.
        schema:
          type: string
    delete:
      operationId: unban
      tags: [social]
      summary: Lifts a ban.
      responses:
        "200":
          $ref: "#/components/responses/Ok"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"

  /update:
    get:
      operationId: getUpdate
      tags: [updates]
      summary: What is known of new versions of njMule.
      responses:
        "200":
          $ref: "#/components/responses/Update"
        default:
          $ref: "#/components/responses/Error"
  /update/check:
    post:
      operationId: checkForUpdate
      tags: [updates]
      summary: Looks for a new version now, whatever the preferences say.
      description: |
        Joins the check already running, if any. A check that takes longer than ten seconds goes on
        after the answer, 202 with `checking` true: read `GET /update` again, or follow the
        `update.status` event.
      responses:
        "200":
          $ref: "#/components/responses/Update"
        "202":
          $ref: "#/components/responses/Update"
        default:
          $ref: "#/components/responses/Error"
  /update/skip:
    post:
      operationId: skipUpdate
      tags: [updates]
      summary: Stops telling of a version, unless it fixes a security problem.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                version:
                  type: string
                  minLength: 1
                  maxLength: 64
      responses:
        "200":
          $ref: "#/components/responses/Update"
        "400":
          $ref: "#/components/responses/BadRequest"
        default:
          $ref: "#/components/responses/Error"
  /update/download:
    post:
      operationId: downloadUpdate
      tags: [updates]
      summary: Downloads the package of the new version for this installation, and checks it.
      description: |
        Joins the download already running, if any. One that takes longer than ten seconds goes on
        after the answer, 202 with the progress in `download`: read `GET /update` again, or follow
        the `update.status` and `update.ready` events. A download that failed tells why in
        `failure`; it goes on from where it stopped the next time.
      responses:
        "200":
          $ref: "#/components/responses/Update"
        "202":
          $ref: "#/components/responses/Update"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/Error"
  /update/install:
    post:
      operationId: installUpdate
      tags: [updates]
      summary: Installs the version downloaded, now or when njMule exits.
      description: |
        Now (the default), njMule saves everything, stops, puts the new version in place and starts
        again: the answer comes first, 202 with `install` set to `restart`, then the
        `update.restart` event and the end of the event stream. Refused with 409 when no version is
        downloaded or njMule cannot replace itself here (`canInstall` false: a package manager,
        the Package Center or Docker updates it).
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                restart:
                  type: boolean
                  default: true
                  description: Whether to install now, restarting njMule, or when it exits.
      responses:
        "200":
          $ref: "#/components/responses/Update"
        "202":
          $ref: "#/components/responses/Update"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/Error"

components:
  securitySchemes:
    token:
      type: http
      scheme: bearer
      bearerFormat: 43 characters of URL-safe Base64 (256 random bits)
      description: The API token of the njMule, from the `api-token` file of its configuration directory.

  parameters:
    Hash:
      name: hash
      in: path
      required: true
      description: The file hash of the download or shared file.
      schema:
        $ref: "#/components/schemas/Hash"
    SearchId:
      name: id
      in: path
      required: true
      description: The id the search was given when it started.
      schema:
        $ref: "#/components/schemas/SearchId"
    ServerAddress:
      name: address
      in: path
      required: true
      description: The server, as host:port.
      schema:
        $ref: "#/components/schemas/HostPort"

  responses:
    Ok:
      description: Done.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Ok"
    Added:
      description: How many entries of the list were added.
      content:
        application/json:
          schema:
            type: object
            required: [added]
            properties:
              added:
                type: integer
                minimum: 0
    Download:
      description: The download, as it is now.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Download"
    Update:
      description: What is known of new versions now.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Update"
    Limits:
      description: The speed limits now.
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Limits"
              - required: [uploadKiBps, downloadKiBps]
    BadRequest:
      description: The request does not follow this document, or names something the engine refuses.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Nothing of that name is known.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: The engine's state does not allow it now.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TooLarge:
      description: The body is larger than 1 MiB.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unavailable:
      description: Too many event streams are open.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Error:
      description: |
        Any other failure: 401 without the right token (with `WWW-Authenticate: Bearer`), 404 for an
        unknown path, 405 for a method the path does not take (with `Allow`), 429 after too many wrong
        tokens, 500 when the request failed, 503 when the engine cannot answer in time.
      headers:
        WWW-Authenticate:
          description: Sent with 401 and 429.
          schema:
            type: string
            const: Bearer
        Allow:
          description: Sent with 405, the methods the path takes.
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: What went wrong, for the caller.
    Ok:
      type: object
      required: [ok]
      properties:
        ok:
          const: true
    ApiInfo:
      type: object
      required: [name, version, api]
      properties:
        name:
          const: njMule
        version:
          type: string
          description: The version of njMule.
        api:
          type: integer
          description: The version of the API, which grows when calls are added.

    Hash:
      type: string
      pattern: "^[0-9A-Fa-f]{32}$"
    SearchId:
      type: integer
      format: int64
    CategoryId:
      type: integer
      format: int32
      minimum: 0
    HostPort:
      type: string
      minLength: 1
      description: A host name or IP address and a port, as `host:port` (`[address]:port` for IPv6).
    AddressBody:
      type: object
      required: [address]
      properties:
        address:
          $ref: "#/components/schemas/HostPort"
    WebList:
      type: object
      required: [url]
      properties:
        url:
          type: string
          format: uri
          pattern: "^\\s*[Hh][Tt][Tt][Pp][Ss]?://"
          description: An http or https address.
    Limits:
      type: object
      description: Speed limits in KiB/s; 0 is unlimited.
      properties:
        uploadKiBps:
          type: integer
          minimum: 0
          maximum: 10000000
        downloadKiBps:
          type: integer
          minimum: 0
          maximum: 10000000

    DownloadPriority:
      type: string
      enum: [low, normal, high, auto]
    UploadPriority:
      type: string
      enum: [very_low, low, normal, high, release, auto]
    SearchScope:
      type: string
      enum: [server, global, kad, automatic]
      default: server
      description: >-
        The connected server, every known server, or Kad; automatic picks the network connected, Kad
        when both are unless the server is a static or a big one.

    Status:
      type: object
      required:
        - server
        - clientId
        - lowId
        - obfuscated
        - kad
        - downloadBytesPerSecond
        - uploadBytesPerSecond
        - downloaded
        - uploaded
        - downloads
        - uploads
        - queued
        - sharedFiles
        - totalDownloaded
        - totalUploaded
        - sessions
        - sessionSeconds
        - totalSeconds
        - publicIp
        - tcpPort
        - overheadUploaded
        - overheadDownloaded
      properties:
        upnp:
          type: boolean
          description: Whether the router is asked to forward our ports.
        forwarding:
          type: string
          enum: [off, asking, forwarded, partly, refused, no_router, failed]
          description: >-
            What the router answered when asked through UPnP to forward our ports: off while it is not asked, asking
            until it answers.
        router:
          type: string
          description: The host of the router that answered UPnP, empty when none did.
        routerTraversal:
          type: boolean
          description: >-
            Whether firewalled clients may be met through the routers, over uTP or QUIC: not where obfuscation is
            required nor behind a proxy, and only while Kad runs.
        server:
          description: The server we are connected to, or null.
          oneOf:
            - $ref: "#/components/schemas/Server"
            - type: "null"
        clientId:
          type: integer
          format: int64
        lowId:
          type: boolean
        obfuscated:
          type: boolean
        kad:
          description: The state of Kad, or null while it is off.
          oneOf:
            - $ref: "#/components/schemas/Kad"
            - type: "null"
        downloadBytesPerSecond:
          type: integer
          format: int64
        uploadBytesPerSecond:
          type: integer
          format: int64
        downloaded:
          type: integer
          format: int64
          description: Bytes downloaded in this session.
        uploaded:
          type: integer
          format: int64
          description: Bytes uploaded in this session.
        downloads:
          type: integer
        uploads:
          type: integer
        queued:
          type: integer
        sharedFiles:
          type: integer
        totalDownloaded:
          type: integer
          format: int64
        totalUploaded:
          type: integer
          format: int64
        sessions:
          type: integer
          format: int64
        sessionSeconds:
          type: integer
          format: int64
        totalSeconds:
          type: integer
          format: int64
        publicIp:
          type: string
        publicIpv6:
          type: string
          description: Our public IPv6 address, at which clients may reach us; present when we have one.
        tcpPort:
          type: integer
        overheadUploaded:
          type: integer
          format: int64
          description: The bytes of packets sent this session besides file data.
        overheadDownloaded:
          type: integer
          format: int64
          description: The bytes of packets received this session besides file data.
        missingInterface:
          type: string
          description: Present while the network interface the preferences bind to is gone, which keeps njMule offline.
        relatedSearch:
          type: boolean
          description: Whether the server we are on finds the files related to others (related::<hash> searches).
        freeSpace:
          type: object
          description: The bytes free on the disks of the incoming and temporary folders, when they could be read.
          properties:
            incoming:
              type: integer
              format: int64
            temp:
              type: integer
              format: int64
    Server:
      type: object
      required:
        - address
        - name
        - description
        - users
        - files
        - maxUsers
        - lowIdUsers
        - softFiles
        - hardFiles
        - failed
        - priority
        - ping
        - version
        - obfuscation
        - static
      properties:
        address:
          type: string
        name:
          type: string
        description:
          type: string
        users:
          type: integer
          format: int64
        files:
          type: integer
          format: int64
        maxUsers:
          type: integer
          format: int64
        lowIdUsers:
          type: integer
          format: int64
        softFiles:
          type: integer
          format: int64
        hardFiles:
          type: integer
          format: int64
        failed:
          type: integer
        priority:
          type: string
          enum: [high, normal, low]
        ping:
          type: integer
          format: int64
        version:
          type: string
        obfuscation:
          type: boolean
        static:
          type: boolean
    Kad:
      type: object
      required:
        - connected
        - firewalled
        - contacts
        - verifiedContacts
        - id
        - publicIp
        - udpPort
        - udpFirewalled
        - udpVerified
        - buddy
        - users
        - files
      properties:
        connected:
          type: boolean
        firewalled:
          type: boolean
        contacts:
          type: integer
        verifiedContacts:
          type: integer
        id:
          type: string
        publicIp:
          type: string
        udpPort:
          type: integer
        udpFirewalled:
          type: boolean
        udpVerified:
          type: boolean
        buddy:
          type: string
          enum: [none, connecting, connected, serving]
        users:
          type: integer
          format: int64
          description: The users of Kad, as estimated from the contacts.
        files:
          type: integer
          format: int64
          description: The files on Kad, as estimated from the contacts.
    Download:
      type: object
      required:
        - hash
        - name
        - size
        - completed
        - status
        - priority
        - category
        - sources
        - transferring
        - bytesPerSecond
        - previewFirst
        - link
      properties:
        hash:
          $ref: "#/components/schemas/Hash"
        name:
          type: string
        size:
          type: integer
          format: int64
        completed:
          type: integer
          format: int64
          description: Bytes of the file already here.
        status:
          type: string
          enum: [downloading, paused, stopped, no_space, error, complete]
        priority:
          $ref: "#/components/schemas/DownloadPriority"
        category:
          $ref: "#/components/schemas/CategoryId"
        sources:
          type: integer
        transferring:
          type: integer
          description: Sources sending data now.
        bytesPerSecond:
          type: integer
          format: int64
        previewFirst:
          type: boolean
        autoSwap:
          type: boolean
          description: Whether sources asked for another file come to this one whenever they are free to move.
        link:
          type: string
          description: The eD2K link of the file.
        kind:
          type: string
          enum: [video, audio, image, document, archive, disc_image, program, other]
          description: What the file is, as its extension tells.
    Source:
      type: object
      required:
        - file
        - fileName
        - address
        - nick
        - software
        - state
        - queueRank
        - received
        - parts
        - partCount
        - reportedName
        - askedFor
        - askedForName
      properties:
        file:
          $ref: "#/components/schemas/Hash"
        fileName:
          type: string
        address:
          type: string
        nick:
          type: [string, "null"]
        software:
          type: string
        state:
          type: string
          enum: [waiting, connecting, asking, queued, downloading, a4af, queue_full, no_needed_parts]
        queueRank:
          type: integer
        received:
          type: integer
          format: int64
        parts:
          type: integer
          description: Parts of the file the source has.
        partCount:
          type: integer
        reportedName:
          type: [string, "null"]
          description: The name the source gives the file, when it differs.
        askedFor:
          type: [string, "null"]
          pattern: "^[0-9A-F]{32}$"
          description: The hash of the download the source is asked for instead (A4AF), when it is another one.
        askedForName:
          type: string
          description: The name of that download; empty when there is none.
        country:
          type: [string, "null"]
          pattern: "^[a-z]{2}$"
          description: The client's country (ISO 3166-1, lower case), when the countries are shown and it is known.
    KnownClient:
      type: object
      required: [userHash, nick, software, firstSeen, lastSeen, uploaded, downloaded]
      properties:
        userHash:
          type: string
          pattern: "^[0-9A-F]{32}$"
        nick:
          type: string
          description: The name it gave last; empty when it gave none.
        software:
          type: string
          description: The program it said it runs, last.
        firstSeen:
          type: integer
          format: int64
          description: When it was first met, in seconds since the epoch.
        lastSeen:
          type: integer
          format: int64
          description: When it was last met, in seconds since the epoch.
        country:
          type: [string, "null"]
          pattern: "^[a-z]{2}$"
          description: Where it was last met from (ISO 3166-1, lower case), when the countries were shown.
        uploaded:
          type: integer
          format: int64
          description: The bytes sent to it, of all times.
        downloaded:
          type: integer
          format: int64
          description: The bytes it sent, of all times.
    Upload:
      type: object
      required:
        - address
        - userHash
        - nick
        - software
        - file
        - state
        - transferred
        - bytesPerSecond
        - waitingSeconds
      properties:
        address:
          type: string
        userHash:
          $ref: "#/components/schemas/Hash"
        nick:
          type: [string, "null"]
        software:
          type: string
        file:
          type: string
        state:
          type: string
          enum: [uploading, queued]
        transferred:
          type: integer
          format: int64
        bytesPerSecond:
          type: integer
          format: int64
        waitingSeconds:
          type: integer
          format: int64
        country:
          type: [string, "null"]
          pattern: "^[a-z]{2}$"
          description: The client's country (ISO 3166-1, lower case), when the countries are shown and it is known.
    SharedFile:
      type: object
      required: [hash, name, size, path, priority, link, statistics]
      properties:
        hash:
          $ref: "#/components/schemas/Hash"
        name:
          type: string
        size:
          type: integer
          format: int64
        path:
          type: string
        priority:
          $ref: "#/components/schemas/UploadPriority"
        link:
          type: string
        statistics:
          type: object
          description: The requests, accepted uploads and bytes sent of this session and of all of them.
          required: [requests, accepted, transferred, totalRequests, totalAccepted, totalTransferred]
          properties:
            requests:
              type: integer
              format: int64
            accepted:
              type: integer
              format: int64
            transferred:
              type: integer
              format: int64
            totalRequests:
              type: integer
              format: int64
            totalAccepted:
              type: integer
              format: int64
            totalTransferred:
              type: integer
              format: int64
    SharedDirectory:
      type: object
      required: [path, subdirectories]
      properties:
        path:
          type: string
        subdirectories:
          type: boolean
    SearchResult:
      type: object
      required: [hash, name, size, sources, completeSources, type, spamRating, spam, names]
      properties:
        known:
          type: string
          enum: [downloading, shared, downloaded, cancelled]
          description: What we know of the file, in the results of a search read through the API.
        media:
          type: object
          description: What the file's publishers told of its content.
          properties:
            artist:
              type: string
            album:
              type: string
            title:
              type: string
            length:
              type: integer
              description: Seconds.
            bitrate:
              type: integer
              description: kbit/s.
            codec:
              type: string
        hash:
          $ref: "#/components/schemas/Hash"
        name:
          type: string
        size:
          type: integer
          format: int64
        sources:
          type: integer
        completeSources:
          $ref: "#/components/schemas/CompleteSources"
        type:
          type: [string, "null"]
          description: The file type the network gives, if any.
        spamRating:
          type: integer
        spam:
          type: boolean
        names:
          type: array
          description: The names the file was found under, when more than one.
          items:
            type: object
            required: [name, sources, completeSources]
            properties:
              name:
                type: string
              sources:
                type: integer
              completeSources:
                $ref: "#/components/schemas/CompleteSources"
    SavedSearch:
      type: object
      required: [title, query, scope, results]
      properties:
        title:
          type: string
          description: The title of the tab.
        query:
          type: string
          description: What was searched for.
        scope:
          type: string
          enum: [server, global, kad]
        results:
          type: array
          items:
            $ref: "#/components/schemas/SearchResult"
    SpamMarks:
      type: object
      required: [spam, notSpam, names]
      properties:
        spam:
          type: array
          description: The files marked as spam.
          items:
            $ref: "#/components/schemas/Hash"
        notSpam:
          type: array
          description: The files marked as not spam, whatever else they look like.
          items:
            $ref: "#/components/schemas/Hash"
        names:
          type: array
          description: The names, lower case, of the files marked as spam; long ones mark others named so.
          items:
            type: string
    PeerInfo:
      type: object
      required: [address, userHash, nick, software, obfuscated, identification]
      properties:
        address:
          type: string
        userHash:
          $ref: "#/components/schemas/Hash"
        nick:
          type: [string, "null"]
        software:
          type: string
        obfuscated:
          type: boolean
          description: Whether the connection was obfuscated.
        identification:
          type: string
          enum: [verified, failed, not_supported, pending]
          description: The outcome of the secure identification.
    CompleteSources:
      type: [integer, "null"]
      description: Sources with the whole file; null when the network does not tell, as Kad.
    Category:
      type: object
      required: [id, name, incoming, comment, priority]
      properties:
        id:
          $ref: "#/components/schemas/CategoryId"
        name:
          type: string
        incoming:
          type: [string, "null"]
          description: The directory its completed files go to, if it has its own.
        comment:
          type: string
        priority:
          $ref: "#/components/schemas/DownloadPriority"
        color:
          type: integer
          description: 0 for none, then the tints of the desktop app.
        patterns:
          type: string
          description: File name patterns separated by |, that put new downloads in it.
        regex:
          type: boolean
          description: Whether the patterns are regular expressions.
    Friend:
      type: object
      required: [userHash, name, address]
      properties:
        userHash:
          $ref: "#/components/schemas/Hash"
        name:
          type: string
        address:
          type: [string, "null"]
    Preferences:
      type: object
      description: Values as text, by the keys of njmule.properties (user.nick, net.tcpPort, ...).
      additionalProperties:
        type: string
        maxLength: 16384
    Schedule:
      type: object
      required: [rules]
      properties:
        rules:
          type: array
          items:
            $ref: "#/components/schemas/ScheduleRule"
        active:
          type: string
          description: The name of the rule that applies now.
    ScheduleRule:
      type: object
      required: [start, end]
      description: >-
        A window of the days named; one that ends before it starts runs past midnight, and one that
        starts when it ends lasts the whole day. A value left out leaves the preference as it is.
      properties:
        name:
          type: string
          maxLength: 100
        enabled:
          type: boolean
          default: true
        days:
          type: array
          items:
            type: string
            enum: [monday, tuesday, wednesday, thursday, friday, saturday, sunday]
        start:
          type: string
          description: hh:mm
        end:
          type: string
          description: hh:mm
        uploadKiBps:
          type: integer
          minimum: 0
        downloadKiBps:
          type: integer
          minimum: 0
        maxConnections:
          type: integer
          minimum: 1
        maxSourcesPerFile:
          type: integer
          minimum: 1
        stopCategory:
          type: integer
          minimum: 0
        resumeCategory:
          type: integer
          minimum: 0
    PartMap:
      type: object
      required: [size, missing, requested, sources]
      properties:
        size:
          type: integer
          format: int64
        missing:
          $ref: "#/components/schemas/Spans"
        requested:
          $ref: "#/components/schemas/Spans"
        sources:
          type: array
          description: The sources that have each part, in the order of the parts.
          items:
            type: integer
    Spans:
      type: array
      description: Byte ranges, each [start, end) as two numbers.
      items:
        type: array
        minItems: 2
        maxItems: 2
        items:
          type: integer
          format: int64
    Comment:
      type: object
      required: [who, fileName, rating, text]
      properties:
        who:
          type: string
        fileName:
          type: string
        rating:
          type: integer
          minimum: 0
          maximum: 5
          description: 0 not rated, 1 invalid or fake, then poor, fair, good, excellent.
        text:
          type: string
    OwnComment:
      type: object
      required: [rating]
      properties:
        rating:
          type: integer
          minimum: 0
          maximum: 5
        text:
          type: string
          maxLength: 128
    ServerLists:
      type: object
      required: [addresses]
      properties:
        addresses:
          type: array
          maxItems: 64
          items:
            type: string
            minLength: 1
            description: An http or https address of a server.met.
    PortTest:
      type: object
      required: [tcpPort, udpPort, forwarding, router, tcp, udp, done]
      properties:
        tcpPort:
          type: integer
        udpPort:
          type: integer
        forwarding:
          type: string
          enum: [off, asking, forwarded, partly, refused, no_router, failed]
        router:
          type: string
        tcp:
          type: string
          enum: [testing, open, closed, unknown]
        udp:
          type: string
          enum: [testing, open, closed, unknown]
        done:
          type: boolean
    FriendSlot:
      type: object
      required: [userHash]
      properties:
        userHash:
          oneOf:
            - $ref: "#/components/schemas/Hash"
            - type: "null"
    Conversation:
      type: object
      required: [address, lines]
      properties:
        address:
          type: string
        userHash:
          $ref: "#/components/schemas/Hash"
        nick:
          type: string
        captcha:
          type: string
          contentEncoding: base64
          contentMediaType: image/bmp
          description: A picture whose letters the client wants typed before it reads our messages.
        lines:
          type: array
          items:
            type: object
            required: [sequence, time, author, text]
            properties:
              sequence:
                type: integer
                format: int64
              time:
                type: string
                format: date-time
              author:
                type: string
                enum: [us, them, notice]
              text:
                type: string
              notice:
                type: string
                enum: [captcha_passed, captcha_wrong, not_delivered]
                description: What a notice tells; the text of not_delivered is the reason.
    Ban:
      type: object
      required: [address, secondsLeft]
      properties:
        address:
          type: string
        secondsLeft:
          type: integer
          format: int64
    KadContact:
      type: object
      required: [id, address, type, distance, version, verified]
      properties:
        id:
          type: string
        address:
          type: string
        type:
          type: integer
        distance:
          type: string
        version:
          type: integer
        verified:
          type: boolean
    KadSearch:
      type: object
      required: [target, kind, answers]
      properties:
        target:
          type: string
        kind:
          type: string
          enum: [node, keyword, sources, notes, store_keyword, store_source, store_notes]
        answers:
          type: integer
    LogLine:
      type: object
      required: [time, level, message]
      properties:
        time:
          type: string
          format: date-time
        level:
          type: string
          enum: [debug, info, success, warning, error]
        message:
          type: string
    LogEntry:
      allOf:
        - $ref: "#/components/schemas/LogLine"
        - type: object
          required: [sequence]
          properties:
            sequence:
              type: integer
              format: int64
              description: The number of the line, for the next call's `after`.

    # The events of the stream: each one's data is the JSON of its schema below.
    EngineEvent:
      type: object
      required: [event, data]
      properties:
        event:
          type: string
        data:
          type: string
          contentMediaType: application/json
        id:
          type: string
        retry:
          type: integer
          minimum: 0
      oneOf:
        - $ref: "#/components/schemas/StartedEvent"
        - $ref: "#/components/schemas/StoppingEvent"
        - $ref: "#/components/schemas/PreferencesChangedEvent"
        - $ref: "#/components/schemas/LogEvent"
        - $ref: "#/components/schemas/ServerConnectingEvent"
        - $ref: "#/components/schemas/ServerConnectedEvent"
        - $ref: "#/components/schemas/ServerDisconnectedEvent"
        - $ref: "#/components/schemas/ServerMessageEvent"
        - $ref: "#/components/schemas/ServerUpdatedEvent"
        - $ref: "#/components/schemas/ServersChangedEvent"
        - $ref: "#/components/schemas/SearchResultsEvent"
        - $ref: "#/components/schemas/SearchEndedEvent"
        - $ref: "#/components/schemas/DownloadAddedEvent"
        - $ref: "#/components/schemas/DownloadProgressEvent"
        - $ref: "#/components/schemas/DownloadCompletedEvent"
        - $ref: "#/components/schemas/DownloadFailedEvent"
        - $ref: "#/components/schemas/DownloadRemovedEvent"
        - $ref: "#/components/schemas/DiskSpaceEvent"
        - $ref: "#/components/schemas/MessageReceivedEvent"
        - $ref: "#/components/schemas/CaptchaRequestedEvent"
        - $ref: "#/components/schemas/CaptchaAnsweredEvent"
        - $ref: "#/components/schemas/MessageFailedEvent"
        - $ref: "#/components/schemas/UpdateStatusEvent"
        - $ref: "#/components/schemas/UpdateAvailableEvent"
        - $ref: "#/components/schemas/UpdateReadyEvent"
        - $ref: "#/components/schemas/UpdateRestartEvent"
        - $ref: "#/components/schemas/LostEvent"
    StartedEvent:
      properties:
        event:
          const: started
        data:
          contentSchema:
            type: object
            required: [version]
            properties:
              version:
                type: string
    StoppingEvent:
      properties:
        event:
          const: stopping
        data:
          contentSchema:
            $ref: "#/components/schemas/NoData"
    PreferencesChangedEvent:
      description: The preferences changed; read them again through their own calls.
      properties:
        event:
          const: preferences.changed
        data:
          contentSchema:
            $ref: "#/components/schemas/NoData"
    LogEvent:
      properties:
        event:
          const: log
        data:
          contentSchema:
            $ref: "#/components/schemas/LogLine"
    ServerConnectingEvent:
      properties:
        event:
          const: server.connecting
        data:
          contentSchema:
            $ref: "#/components/schemas/ServerData"
    ServerConnectedEvent:
      properties:
        event:
          const: server.connected
        data:
          contentSchema:
            allOf:
              - $ref: "#/components/schemas/ServerData"
              - type: object
                required: [clientId, lowId, obfuscated]
                properties:
                  clientId:
                    type: integer
                    format: int64
                  lowId:
                    type: boolean
                  obfuscated:
                    type: boolean
    ServerDisconnectedEvent:
      properties:
        event:
          const: server.disconnected
        data:
          contentSchema:
            type: object
            required: [reason]
            properties:
              server:
                $ref: "#/components/schemas/Server"
              reason:
                type: string
    ServerMessageEvent:
      properties:
        event:
          const: server.message
        data:
          contentSchema:
            allOf:
              - $ref: "#/components/schemas/ServerData"
              - type: object
                required: [text]
                properties:
                  text:
                    type: string
    ServerUpdatedEvent:
      properties:
        event:
          const: server.updated
        data:
          contentSchema:
            $ref: "#/components/schemas/ServerData"
    ServersChangedEvent:
      properties:
        event:
          const: servers.changed
        data:
          contentSchema:
            type: object
            required: [count]
            properties:
              count:
                type: integer
    SearchResultsEvent:
      properties:
        event:
          const: search.results
        data:
          contentSchema:
            type: object
            required: [search, results]
            properties:
              search:
                $ref: "#/components/schemas/SearchId"
              results:
                type: array
                items:
                  $ref: "#/components/schemas/SearchResult"
    SearchEndedEvent:
      properties:
        event:
          const: search.ended
        data:
          contentSchema:
            type: object
            required: [search, results]
            properties:
              search:
                $ref: "#/components/schemas/SearchId"
              results:
                type: integer
    DownloadAddedEvent:
      properties:
        event:
          const: download.added
        data:
          contentSchema:
            $ref: "#/components/schemas/DownloadData"
    DownloadProgressEvent:
      properties:
        event:
          const: download.progress
        data:
          contentSchema:
            $ref: "#/components/schemas/DownloadData"
    DownloadCompletedEvent:
      properties:
        event:
          const: download.completed
        data:
          contentSchema:
            allOf:
              - $ref: "#/components/schemas/DownloadData"
              - type: object
                required: [file]
                properties:
                  file:
                    type: string
                    description: Where the completed file is.
    DownloadFailedEvent:
      properties:
        event:
          const: download.failed
        data:
          contentSchema:
            allOf:
              - $ref: "#/components/schemas/DownloadData"
              - type: object
                required: [reason]
                properties:
                  reason:
                    type: string
    DownloadRemovedEvent:
      properties:
        event:
          const: download.removed
        data:
          contentSchema:
            type: object
            required: [hash]
            properties:
              hash:
                $ref: "#/components/schemas/Hash"
    DiskSpaceEvent:
      properties:
        event:
          const: disk.space
        data:
          contentSchema:
            type: object
            required: [directory, enough]
            properties:
              directory:
                type: string
              enough:
                type: boolean
    MessageReceivedEvent:
      properties:
        event:
          const: message.received
        data:
          contentSchema:
            type: object
            required: [address, userHash, nick, text]
            properties:
              address:
                type: string
              userHash:
                $ref: "#/components/schemas/Hash"
              nick:
                type: [string, "null"]
              text:
                type: string
    CaptchaRequestedEvent:
      properties:
        event:
          const: captcha.requested
        data:
          contentSchema:
            type: object
            required: [address, userHash]
            properties:
              address:
                type: string
              userHash:
                $ref: "#/components/schemas/Hash"
    CaptchaAnsweredEvent:
      properties:
        event:
          const: captcha.answered
        data:
          contentSchema:
            type: object
            required: [address, solved]
            properties:
              address:
                type: string
              solved:
                type: boolean
    MessageFailedEvent:
      properties:
        event:
          const: message.failed
        data:
          contentSchema:
            type: object
            required: [address, reason]
            properties:
              address:
                type: string
              reason:
                type: string
    UpdateStatusEvent:
      description: |
        What is known of new versions changed: a check or a download started, went on or ended, a
        version was skipped or its installation asked for.
      properties:
        event:
          const: update.status
        data:
          contentSchema:
            type: object
            required: [status]
            properties:
              status:
                $ref: "#/components/schemas/Update"
    UpdateAvailableEvent:
      description: A check njMule ran on its own found a new version worth telling of; once a run for each.
      properties:
        event:
          const: update.available
        data:
          contentSchema:
            type: object
            required: [version]
            properties:
              version:
                $ref: "#/components/schemas/NewVersion"
    UpdateReadyEvent:
      description: The package of a new version is downloaded and checked; it can be installed.
      properties:
        event:
          const: update.ready
        data:
          contentSchema:
            type: object
            required: [version]
            properties:
              version:
                $ref: "#/components/schemas/NewVersion"
    UpdateRestartEvent:
      description: njMule stops to install a new version and starts again; the stream ends soon after.
      properties:
        event:
          const: update.restart
        data:
          contentSchema:
            type: object
            required: [version]
            properties:
              version:
                type: string
    LostEvent:
      description: The caller fell too far behind; the stream ends after it.
      properties:
        event:
          const: lost
        data:
          contentSchema:
            $ref: "#/components/schemas/NoData"
    NoData:
      type: object
      maxProperties: 0
    Update:
      type: object
      required:
        - state
        - current
        - installation
        - installer
        - canInstall
        - checking
        - lastCheck
        - failure
        - available
        - skipped
        - download
        - ready
        - readyFile
        - install
      properties:
        state:
          type: string
          enum: [idle, checking, up_to_date, available, downloading, ready, installing, failed]
          description: Where the update stands, in one word.
        current:
          type: string
          description: The version running.
        installation:
          type: string
          enum: [msi, windows_zip, dmg, deb, rpm, tar, static_tar, synology, docker, unknown]
          description: How this copy was installed, which tells how to update it.
        installer:
          type: string
          enum: [none, self, elevated]
          description: |
            Who puts a new version in place: the user or a package manager (none), njMule (self),
            or njMule once the system has asked for administrator rights (elevated).
        canInstall:
          type: boolean
          description: Whether njMule can install the version downloaded here.
        checking:
          type: boolean
          description: Whether a check runs now.
        lastCheck:
          type: [string, "null"]
          format: date-time
          description: When a check last succeeded.
        failure:
          type: [string, "null"]
          description: |
            Why the last check, download or installation failed; null when it succeeded or none ran.
        available:
          description: The newest version, when it is newer than the one running.
          oneOf:
            - $ref: "#/components/schemas/NewVersion"
            - type: "null"
        skipped:
          type: [string, "null"]
          description: The version the user asked not to be told of again.
        download:
          description: How far the download of the new version is, while it runs.
          oneOf:
            - type: object
              required: [received, size]
              properties:
                received:
                  type: integer
                  format: int64
                  minimum: 0
                size:
                  type: integer
                  format: int64
                  minimum: 0
            - type: "null"
        ready:
          type: boolean
          description: Whether the package of the new version is downloaded and checked.
        readyFile:
          type: [string, "null"]
          description: |
            Where that package is on njMule's computer, to be installed by hand where njMule cannot
            install it (`canInstall` false); null while none is ready.
        install:
          type: string
          enum: [asked, at_exit, restart]
          description: |
            When the version downloaded is installed: when the user asks, when njMule exits, or now,
            njMule stopping and starting again.
    NewVersion:
      type: object
      required: [version, published, critical, notes, page, download]
      properties:
        version:
          type: string
        published:
          type: string
          format: date-time
        critical:
          type: boolean
          description: Whether it fixes a security problem.
        notes:
          type: string
          description: What changed, in Markdown.
        page:
          type: string
          format: uri
          description: The page of the release.
        download:
          description: The package for this installation, null when none fits.
          oneOf:
            - type: object
              required: [url, size, sha256]
              properties:
                url:
                  type: string
                  format: uri
                size:
                  type: integer
                  format: int64
                  minimum: 1
                sha256:
                  type: string
                  pattern: "^[0-9a-f]{64}$"
            - type: "null"
    ServerData:
      type: object
      required: [server]
      properties:
        server:
          $ref: "#/components/schemas/Server"
    DownloadData:
      type: object
      required: [download]
      properties:
        download:
          $ref: "#/components/schemas/Download"
