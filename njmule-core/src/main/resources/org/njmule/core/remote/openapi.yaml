#
# The remote-control API of njMule. This document is the source of the API: the core routes every
# request by its paths, methods and operationId, and checks parameters and bodies against its
# schemas before an operation runs.
openapi: 3.2.0
info:
  title: njMule remote-control API
  summary: Drive a running njMule over HTTP with JSON, and follow its events.
  description: |
    Every call needs the API token of the njMule it reaches, sent as `Authorization: Bearer <token>`.
    The token is kept in the `api-token` file of njMule's configuration directory; `njmule --api-token`
    prints it and `njmule --new-api-token` replaces it. Wrong tokens count as failed logins of the
    caller's address, which must wait a minute after five of them.

    Enum values are lower case. Hashes are the 32 hexadecimal digits of an MD4 file or user hash.
    Errors answer with an `Error` object whose message is meant for the caller.
  version: "1"
  license:
    name: GNU General Public License v3.0 or later
    identifier: GPL-3.0-or-later
servers:
  - url: "{scheme}://{host}:{port}/api/v1"
    description: The web interface of njMule, with the remote-control API turned on.
    variables:
      scheme:
        enum: [http, https]
        default: http
        description: https only through a reverse proxy; njMule itself serves plain HTTP.
      host:
        default: 127.0.0.1
      port:
        default: "4711"
security:
  - token: []
tags:
  - name: api
    summary: API
    description: The API itself.
  - name: engine
    summary: Engine
    description: State of the engine, speed limits, log and events; stopping njMule.
  - name: downloads
    summary: Downloads
    description: Files being downloaded and their sources.
  - name: uploads
    summary: Uploads and sharing
    description: Clients served now or waiting, and the files shared with the network.
  - name: servers
    summary: eD2K servers
  - name: kad
    summary: Kad
    description: The Kad network.
  - name: searches
    summary: Searches
    description: Searches started through the API and their results.
  - name: social
    summary: Friends, messages and bans
  - name: updates
    summary: Updates
    description: |
      New versions of njMule, as the signed information of its releases on GitHub tells: looked for,
      downloaded and checked against that information, and installed where njMule may replace
      itself (the Windows installer and zip, the macOS app, the Linux archives).

paths:
  /:
    get:
      operationId: getApi
      tags: [api]
      summary: Name and version of njMule and of the API.
      responses:
        "200":
          description: njMule and the version of the API.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiInfo"
        default:
          $ref: "#/components/responses/Error"
  /openapi.yaml:
    get:
      operationId: getSpecification
      tags: [api]
      summary: This document.
      responses:
        "200":
          description: The OpenAPI document of the API.
          content:
            application/yaml:
              schema:
                type: string
        default:
          $ref: "#/components/responses/Error"

  /status:
    get:
      operationId: getStatus
      tags: [engine]
      summary: Connections, speeds and counters of the engine.
      responses:
        "200":
          description: The state of the engine.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
        default:
          $ref: "#/components/responses/Error"
  /limits:
    get:
      operationId: getLimits
      tags: [engine]
      summary: The speed limits.
      responses:
        "200":
          $ref: "#/components/responses/Limits"
        default:
          $ref: "#/components/responses/Error"
    put:
      operationId: setLimits
      tags: [engine]
      summary: Changes the speed limits; a limit left out stays as it is.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Limits"
      responses:
        "200":
          $ref: "#/components/responses/Limits"
        "400":
          $ref: "#/components/responses/BadRequest"
        default:
          $ref: "#/components/responses/Error"
  /preferences:
    get:
      operationId: getPreferences
      tags: [engine]
      summary: Every preference, as njMule's njmule.properties file writes it.
      description: The proxy password is never given.
      responses:
        "200":
          description: The preferences by key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Preferences"
        default:
          $ref: "#/components/responses/Error"
    patch:
      operationId: updatePreferences
      tags: [engine]
      summary: Changes the preferences named, as the file's values are read; the others stay.
      description: >-
        An unknown key or a wrong value changes nothing, and the error names the key. Ports, UPnP,
        the proxy and the network interface take effect when njMule connects again.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/Preferences"
                - minProperties: 1
      responses:
        "200":
          description: The preferences as they are now.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Preferences"
        "400":
          $ref: "#/components/responses/BadRequest"
        default:
          $ref: "#/components/responses/Error"
  /schedule:
    get:
      operationId: getSchedule
      tags: [engine]
      summary: The rules that change limits at the times they name, and the one that applies now.
      responses:
        "200":
          description: The schedule.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Schedule"
        default:
          $ref: "#/components/responses/Error"
    put:
      operationId: setSchedule
      tags: [engine]
      summary: Replaces the rules of the schedule.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rules]
              properties:
                rules:
                  type: array
                  maxItems: 100
                  items:
                    $ref: "#/components/schemas/ScheduleRule"
      responses:
        "200":
          description: The schedule as it is now.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Schedule"
        "400":
          $ref: "#/components/responses/BadRequest"
        default:
          $ref: "#/components/responses/Error"
  /rates:
    get:
      operationId: getRates
      tags: [engine]
      summary: The transfer rates of the last minutes or of the last day, as njMule sampled them.
      parameters:
        - name: span
          in: query
          description: Seconds back; up to an hour comes a sample a second, a day a sample a minute.
          schema:
            type: integer
            enum: [600, 3600, 86400]
            default: 600
      responses:
        "200":
          description: The rates, oldest first, each [download, upload] in bytes a second.
          content:
            application/json:
              schema:
                type: object
                required: [step, rates]
                properties:
                  step:
                    type: integer
                    description: The seconds between two samples.
                  rates:
                    type: array
                    items:
                      type: array
                      minItems: 2
                      maxItems: 2
                      items:
                        type: integer
                        format: int64
        default:
          $ref: "#/components/responses/Error"
  /import/emule:
    post:
      operationId: importEmule
      tags: [engine]
      summary: Checks or imports an eMule profile, reading its folder without changing it.
      description: >-
        Servers, Kad contacts, known and shared files and the preferences are taken over; ports and
        folders stay njMule's own. A check (dryRun, the default) changes nothing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path]
              properties:
                path:
                  type: string
                  minLength: 1
                  maxLength: 4096
                  description: The absolute path of eMule's configuration folder.
                dryRun:
                  type: boolean
                  default: true
                identity:
                  type: boolean
                  default: false
                  description: Also takes eMule's user hash, key and credits from the next start.
                downloads:
                  type: boolean
                  default: false
                  description: Also copies the downloads in progress.
      responses:
        "200":
          description: What was, or would be, taken.
          content:
            application/json:
              schema:
                type: object
                required: [dryRun, startAtLogin, items]
                properties:
                  dryRun:
                    type: boolean
                  startAtLogin:
                    type: boolean
                  items:
                    type: array
                    items:
                      type: object
                      required: [file, outcome, detail, phrases]
                      properties:
                        file:
                          type: string
                        outcome:
                          type: string
                          enum: [imported, would_import, skipped, missing, failed]
                        detail:
                          type: string
                          description: The phrases in English, joined by "; ".
                        phrases:
                          type: array
                          description: >-
                            The detail as texts of the interface's translations (nj.import.d.*), whose %s and %d
                            take the arguments in order; a client joins them by "; ".
                          items:
                            type: object
                            required: [key, args]
                            properties:
                              key:
                                type: string
                              args:
                                type: array
                                items:
                                  type: [string, integer]
        "400":
          $ref: "#/components/responses/BadRequest"
        default:
          $ref: "#/components/responses/Error"
  /ipfilter:
    post:
      operationId: updateIpFilter
      tags: [engine]
      summary: Replaces the IP filter with the list at an address.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebList"
      responses:
        "200":
          $ref: "#/components/responses/Added"
        "400":
          $ref: "#/components/responses/BadRequest"
        default:
          $ref: "#/components/responses/Error"
  /ipfilter/lists:
    post:
      operationId: updateIpFilterLists
      tags: [engine]
      summary: Replaces the IP filter with the lists of the preferences, joined into one.
      responses:
        "200":
          $ref: "#/components/responses/Added"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/Error"
  /log:
    get:
      operationId: getLog
      tags: [engine]
      summary: The latest lines of the log, oldest first.
      parameters:
        - name: after
          in: query
          description: Only the lines numbered above this one.
          schema:
            type: integer
            format: int64
            minimum: 0
            default: 0
      responses:
        "200":
          description: Up to the last 500 lines.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LogEntry"
        "400":
          $ref: "#/components/responses/BadRequest"
        default:
          $ref: "#/components/responses/Error"
  /events:
    get:
      operationId: streamEvents
      tags: [engine]
      summary: The engine's events as server-sent events, until the caller leaves.
      description: |
        Each event's `event` field is its name, `data` its JSON and `id` its number in the stream.
        Comments keep an idle stream alive every 15 seconds. A caller that falls too far behind
        gets a `lost` event and is cut off: it reads the state again and reconnects. At most
        eight streams are open at once.
      parameters:
        - name: types
          in: query
          description: Prefixes of the event names wanted, such as `download` or `server.connected`; all when empty.
          style: form
          explode: false
          schema:
            type: array
            items:
              type: string
      responses:
        "200":
          description: The stream of events.
          content:
            text/event-stream:
              itemSchema:
                $ref: "#/components/schemas/EngineEvent"
        "503":
          $ref: "#/components/responses/Unavailable"
        default:
          $ref: "#/components/responses/Error"
  /shutdown:
    post:
      operationId: shutdown
      tags: [engine]
      summary: Stops njMule.
      responses:
        "202":
          $ref: "#/components/responses/Ok"
        "501":
          description: This njMule cannot be stopped from the API.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          $ref: "#/components/responses/Error"

  /downloads:
    get:
      operationId: listDownloads
      tags: [downloads]
      summary: The downloads.
      parameters:
        - name: include
          in: query
          description: With parts, each download comes with the map of its parts.
          schema:
            type: string
            enum: [parts]
      responses:
        "200":
          description: Every download; the completed ones come last and stay until they are cleared.
          content:
            application/json:
              schema:
                type: array
                items:
                  allOf:
                    - $ref: "#/components/schemas/Download"
                  properties:
                    parts:
                      $ref: "#/components/schemas/PartMap"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: addDownloads
      tags: [downloads]
      summary: Starts downloading the files of eD2K links.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [links]
              properties:
                links:
                  description: One eD2K file link, or several.
                  oneOf:
                    - type: string
                      minLength: 1
                    - type: array
                      minItems: 1
                      items:
                        type: string
                category:
                  description: The category the downloads join.
                  $ref: "#/components/schemas/CategoryId"
      responses:
        "201":
          description: The downloads of the links, new or already known.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Download"
        "400":
          $ref: "#/components/responses/BadRequest"
        "413":
          $ref: "#/components/responses/TooLarge"
        default:
          $ref: "#/components/responses/Error"
  /downloads/completed:
    delete:
      operationId: clearCompletedDownloads
      tags: [downloads]
      summary: Takes the completed downloads off the list; their files stay.
      responses:
        "200":
          description: How many completed downloads were taken off.
          content:
            application/json:
              schema:
                type: object
                required: [removed]
                properties:
                  removed:
                    type: integer
                    minimum: 0
        default:
          $ref: "#/components/responses/Error"
  /names/cleanup:
    post:
      operationId: cleanUpName
      tags: [downloads]
      summary: A file name tidied, without the words the preferences take out of new names.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  minLength: 1
      responses:
        "200":
          description: The name tidied; the one given when nothing would be left of it.
          content:
            application/json:
              schema:
                type: object
                required: [name]
                properties:
                  name:
                    type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        default:
          $ref: "#/components/responses/Error"
  /downloads/completed/{hash}:
    parameters:
      - $ref: "#/components/parameters/Hash"
    delete:
      operationId: clearCompletedDownload
      tags: [downloads]
      summary: Takes one completed download off the list; its file stays.
      responses:
        "200":
          $ref: "#/components/responses/Ok"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
  /downloads/{hash}:
    parameters:
      - $ref: "#/components/parameters/Hash"
    get:
      operationId: getDownload
      tags: [downloads]
      summary: One download.
      responses:
        "200":
          $ref: "#/components/responses/Download"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: cancelDownload
      tags: [downloads]
      summary: Cancels a download and deletes what it got.
      responses:
        "200":
          $ref: "#/components/responses/Ok"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
  /downloads/{hash}/pause:
    parameters:
      - $ref: "#/components/parameters/Hash"
    post:
      operationId: pauseDownload
      tags: [downloads]
      summary: Pauses a download; it keeps its sources.
      responses:
        "200":
          $ref: "#/components/responses/Download"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
  /downloads/{hash}/resume:
    parameters:
      - $ref: "#/components/parameters/Hash"
    post:
      operationId: resumeDownload
      tags: [downloads]
      summary: Resumes a paused or stopped download.
      responses:
        "200":
          $ref: "#/components/responses/Download"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
  /downloads/{hash}/stop:
    parameters:
      - $ref: "#/components/parameters/Hash"
    post:
      operationId: stopDownload
      tags: [downloads]
      summary: Stops a download and forgets its sources.
      responses:
        "200":
          $ref: "#/components/responses/Download"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
  /downloads/{hash}/parts:
    parameters:
      - $ref: "#/components/parameters/Hash"
    get:
      operationId: getDownloadParts
      tags: [downloads]
      summary: The map of a download's parts.
      responses:
        "200":
          description: What is missing, what is being asked for, and how many sources have each part.
          content:
            application/json:
              schema:
                type: object
                required: [hash, parts]
                properties:
                  hash:
                    $ref: "#/components/schemas/Hash"
                  parts:
                    $ref: "#/components/schemas/PartMap"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
  /downloads/{hash}/preview:
    parameters:
      - $ref: "#/components/parameters/Hash"
    put:
      operationId: setDownloadPreview
      tags: [downloads]
      summary: Asks for the first and last parts first, so that the file can be previewed early.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [previewFirst]
              properties:
                previewFirst:
                  type: boolean
      responses:
        "200":
          description: The download as it is now.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Download"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
  /downloads/{hash}/autoswap:
    parameters:
      - $ref: "#/components/parameters/Hash"
    put:
      operationId: setDownloadAutoSwap
      tags: [downloads]
      summary: Takes the sources shared with other files whenever they are free to move.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [autoSwap]
              properties:
                autoSwap:
                  type: boolean
      responses:
        "200":
          description: The download as it is now.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Download"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
  /downloads/{hash}/swap:
    parameters:
      - $ref: "#/components/parameters/Hash"
    post:
      operationId: swapSources
      tags: [downloads]
      summary: Moves the sources shared with other files to this download now, or this download's to the others.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [direction]
              properties:
                direction:
                  type: string
                  enum: [here, away]
      responses:
        "200":
          $ref: "#/components/responses/Added"
        default:
          $ref: "#/components/responses/Error"
  /downloads/{hash}/comments:
    parameters:
      - $ref: "#/components/parameters/Hash"
    get:
      operationId: listPeerComments
      tags: [downloads]
      summary: The comments the sources of a download gave on it.
      responses:
        "200":
          description: The comments.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Comment"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
  /files/{hash}/comment:
    parameters:
      - $ref: "#/components/parameters/Hash"
    get:
      operationId: getFileComment
      tags: [downloads]
      summary: Our rating and comment of a file, as others see them; 0 and empty while there is none.
      responses:
        "200":
          description: The rating and comment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnComment"
        default:
          $ref: "#/components/responses/Error"
    put:
      operationId: setFileComment
      tags: [downloads]
      summary: Rates and comments a file for others to see.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OwnComment"
      responses:
        "200":
          $ref: "#/components/responses/Ok"
        "400":
          $ref: "#/components/responses/BadRequest"
        default:
          $ref: "#/components/responses/Error"
  /files/{hash}/notes:
    parameters:
      - $ref: "#/components/parameters/Hash"
    get:
      operationId: listKadNotes
      tags: [downloads]
      summary: The notes Kad gave on a file so far.
      responses:
        "200":
          description: The notes.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Comment"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: searchKadNotes
      tags: [downloads]
      summary: Asks Kad for the notes on a file and answers those found.
      responses:
        "200":
          description: The notes found.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Comment"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
  /downloads/{hash}/restore:
    parameters:
      - $ref: "#/components/parameters/Hash"
    post:
      operationId: restoreDownload
      tags: [downloads]
      summary: Brings back a download cancelled in the last seconds, with what it had downloaded.
      responses:
        "200":
          description: The download as it is now.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Download"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
  /downloads/{hash}/priority:
    parameters:
      - $ref: "#/components/parameters/Hash"
    put:
      operationId: setDownloadPriority
      tags: [downloads]
      summary: Sets the priority of a download.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [priority]
              properties:
                priority:
                  $ref: "#/components/schemas/DownloadPriority"
      responses:
        "200":
          $ref: "#/components/responses/Download"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
  /downloads/{hash}/category:
    parameters:
      - $ref: "#/components/parameters/Hash"
    put:
      operationId: setDownloadCategory
      tags: [downloads]
      summary: Moves a download to a category; 0 takes it out of every category.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [category]
              properties:
                category:
                  $ref: "#/components/schemas/CategoryId"
      responses:
        "200":
          $ref: "#/components/responses/Download"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
  /downloads/{hash}/name:
    parameters:
      - $ref: "#/components/parameters/Hash"
    put:
      operationId: renameDownload
      tags: [downloads]
      summary: Renames a download; the name is made safe for any file system.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  minLength: 1
      responses:
        "200":
          $ref: "#/components/responses/Download"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
  /downloads/{hash}/sources:
    parameters:
      - $ref: "#/components/parameters/Hash"
    post:
      operationId: addDownloadSource
      tags: [downloads]
      summary: Adds a client known to have the file as a source of a download.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddressBody"
      responses:
        "200":
          $ref: "#/components/responses/Download"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
  /downloads/{hash}/sources/swap:
    parameters:
      - $ref: "#/components/parameters/Hash"
    post:
      operationId: swapSourceToDownload
      tags: [downloads]
      summary: Moves a source asked for another file to this download, when it is free to move.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddressBody"
      responses:
        "200":
          description: Whether the source moved; it does not while it sends or is about to.
          content:
            application/json:
              schema:
                type: object
                required: [moved]
                properties:
                  moved:
                    type: boolean
        "400":
          $ref: "#/components/responses/BadRequest"
        default:
          $ref: "#/components/responses/Error"
  /sources:
    get:
      operationId: listSources
      tags: [downloads]
      summary: The sources of every download.
      responses:
        "200":
          description: Every source.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Source"
        default:
          $ref: "#/components/responses/Error"

  /uploads:
    get:
      operationId: listUploads
      tags: [uploads]
      summary: The clients served now and those waiting in the queue.
      responses:
        "200":
          description: Every upload.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Upload"
        default:
          $ref: "#/components/responses/Error"
  /clients/known:
    get:
      operationId: listKnownClients
      tags: [transfers]
      summary: The clients met in the last 90 days, those met last first; never their addresses.
      responses:
        "200":
          description: The clients.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/KnownClient"
        default:
          $ref: "#/components/responses/Error"
  /clients/{address}/hello:
    parameters:
      - name: address
        in: path
        required: true
        description: The client, as host:port.
        schema:
          $ref: "#/components/schemas/HostPort"
    post:
      operationId: helloClient
      tags: [uploads]
      summary: Says hello to a client and answers what it said, to see whether and how it is reached.
      responses:
        "200":
          description: What the client said.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PeerInfo"
        "400":
          $ref: "#/components/responses/BadRequest"
        default:
          $ref: "#/components/responses/Error"
  /clients/{address}/files:
    parameters:
      - name: address
        in: path
        required: true
        description: The client, as host:port.
        schema:
          $ref: "#/components/schemas/HostPort"
    post:
      operationId: browseClient
      tags: [uploads]
      summary: Asks a client for the files it shares and answers them, when the client shows them.
      responses:
        "200":
          description: The files the client shares.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [hash, name, size, link]
                  properties:
                    hash:
                      $ref: "#/components/schemas/Hash"
                    name:
                      type: string
                    size:
                      type: integer
                      format: int64
                    type:
                      type: string
                    link:
                      type: string
                      description: The file's eD2K link.
        "400":
          $ref: "#/components/responses/BadRequest"
        default:
          $ref: "#/components/responses/Error"
  /shared:
    get:
      operationId: listSharedFiles
      tags: [uploads]
      summary: The shared files.
      responses:
        "200":
          description: Every shared file.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SharedFile"
        default:
          $ref: "#/components/responses/Error"
  /shared/directories:
    get:
      operationId: listSharedDirectories
      tags: [uploads]
      summary: The shared directories.
      responses:
        "200":
          description: Every shared directory.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SharedDirectory"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: shareDirectory
      tags: [uploads]
      summary: Shares a folder of this computer, with its subfolders or not.
      description: >-
        A whole drive, the user's home folder, Documents, the desktop or a system folder may hold
        personal or system files: it is shared only when `everything` is true. Asked without it, the
        call is a conflict, so that a caller can ask its user first.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path]
              properties:
                path:
                  type: string
                  minLength: 1
                  maxLength: 4096
                  description: The absolute path of an existing folder.
                subdirectories:
                  type: boolean
                  default: true
                everything:
                  type: boolean
                  default: false
                  description: Shares a folder that may hold personal or system files all the same.
      responses:
        "200":
          $ref: "#/components/responses/Ok"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: unshareDirectory
      tags: [uploads]
      summary: Stops sharing a folder; the incoming folder stays shared.
      parameters:
        - name: path
          in: query
          required: true
          description: The path of the shared folder, as the list gives it.
          schema:
            type: string
            minLength: 1
            maxLength: 4096
      responses:
        "200":
          $ref: "#/components/responses/Ok"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
  /shared/{hash}/name:
    parameters:
      - $ref: "#/components/parameters/Hash"
    put:
      operationId: renameSharedFile
      tags: [uploads]
      summary: Renames a shared file; others find it under the new name once it is published again.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 255
      responses:
        "200":
          $ref: "#/components/responses/Ok"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
  /shared/{hash}/priority:
    parameters:
      - $ref: "#/components/parameters/Hash"
    put:
      operationId: setUploadPriority
      tags: [uploads]
      summary: Sets the upload priority of a shared file.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [priority]
              properties:
                priority:
                  $ref: "#/components/schemas/UploadPriority"
      responses:
        "200":
          $ref: "#/components/responses/Ok"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"

  /servers:
    get:
      operationId: listServers
      tags: [servers]
      summary: The known servers.
      responses:
        "200":
          description: Every server.
          content:
            application/json:
