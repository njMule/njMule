# is misspelt or was left in English: the transfers screen (not traffic), the clients and connections
# in the plural, the fair rating, which it words as "very good", the source that asked for another
# file, the obfuscation, the progress, free space and CAPTCHA texts, the downloads of server.met,
# nodes.dat and the IP filter, the node lookup, the spam marks, the sharing of folders, and the web
# interface (not a web server).
