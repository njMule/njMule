# Semantic Versioning 2.0.0: the single source of the project version.
group=org.njmule
version=0.2.0

org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8

# Tags left out of the test runs; run them with e.g. -Ptest.excludedTags=interop,perf -Ptest.tags=private-fixtures
test.excludedTags=interop,private-fixtures,perf
# JVMs running the test classes of one module at once; -Ptest.forks=1 runs them one after the other.
test.forks=4
# Heap of each test JVM.
test.maxHeap=4g
# Optimization of the native images: -O2 by default and for releases; checks may pass -Pnative.optimization=-Ob.
native.optimization=-O2
