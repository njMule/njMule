[package]
name = "njmule-desktop"
version = "0.1.2"
description = "njMule's desktop shell"
license = "GPL-3.0-or-later"
edition = "2021"
publish = false

[[bin]]
name = "njmule-gui"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = ["tray-icon"] }
tauri-plugin-single-instance = { version = "=2.5.5", features = ["deep-link"] }
tauri-plugin-deep-link = "=2.6.3"
tauri-plugin-dialog = "=2.8.4"
tauri-plugin-opener = "=2.7.2"
tauri-plugin-window-state = "=2.5.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
# A small executable: the shell does little but start the engine and show its window.
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
