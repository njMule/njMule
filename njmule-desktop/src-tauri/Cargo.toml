[package]
name = "njmule-desktop"
version = "0.1.2"
description = "njMule's desktop shell"
license = "GPL-3.0-or-later"
edition = "2021"
publish = false

[[bin]]
name = "njmule-gui"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = ["tray-icon"] }
tauri-plugin-single-instance = { version = "=2.5.5", features = ["deep-link"] }
tauri-plugin-deep-link = "=2.6.3"
tauri-plugin-dialog = "=2.8.4"
tauri-plugin-opener = "=2.7.2"
tauri-plugin-window-state = "=2.5.0"
tauri-plugin-notification = "=2.8.0"
# Text only: the clipboard is watched for eD2K links.
arboard = { version = "=3.7.0", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The remembered connections, in the Java properties file the desktop app has always kept them in.
java-properties = "=2.0.0"
encoding_rs = "0.8"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
# A small executable: the shell does little but start the engine and show its window.
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
