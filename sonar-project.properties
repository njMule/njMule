sonar.host.url=https://sonarcloud.io
sonar.organization=njmule
sonar.projectKey=njMule_njMule
sonar.projectName=njMule

sonar.sources=njmule-engine/src,njmule-desktop/src-tauri/src,njmule-ui/src
sonar.tests=njmule-engine/tests,njmule-ui/src/__tests__
sonar.exclusions=njmule-ui/src/__tests__/**,njmule-ui/build/**,**/target/**,**/node_modules/**

# LCOV coverage produced by cargo-llvm-cov in the Rust engine CI job.
sonar.rust.lcov.reportPaths=njmule-engine/target/lcov.info

# Only the Rust engine produces LCOV coverage here; UI and desktop shell run their own test jobs.
sonar.coverage.exclusions=.github/**,website/**,tools/**,packaging/**,njmule-desktop/**,njmule-ui/**

# Wait for the quality gate and fail the job when it is red, blocking the merge.
sonar.qualitygate.wait=true

# MD4, MD5 and SHA-1 are mandated by the eD2K, Kad and AICH wire protocols and file formats.
sonar.issue.ignore.multicriteria=wh1,wh2,wh3,wh4
sonar.issue.ignore.multicriteria.wh1.ruleKey=rust:S4790
sonar.issue.ignore.multicriteria.wh1.resourceKey=njmule-engine/src/crypto/**
sonar.issue.ignore.multicriteria.wh2.ruleKey=rust:S4790
sonar.issue.ignore.multicriteria.wh2.resourceKey=njmule-engine/src/files/**
sonar.issue.ignore.multicriteria.wh3.ruleKey=rust:S4790
sonar.issue.ignore.multicriteria.wh3.resourceKey=njmule-engine/src/persist/format/**
sonar.issue.ignore.multicriteria.wh4.ruleKey=rust:S4790
sonar.issue.ignore.multicriteria.wh4.resourceKey=njmule-engine/src/protocol/**
