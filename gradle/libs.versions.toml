[versions]
java = "25"

# Runtime dependencies
slf4j = "2.0.20"
jackson = "3.2.3"
json-schema-validator = "3.0.8"
jetty = "12.1.14"
logback = "1.6.5"
javafx = "27"
atlantafx = "3.0.0"
ikonli = "12.4.0"
richtextfx = "0.11.7"
bouncycastle = "1.86"
guava = "33.7.2-jre"
picocli = "4.7.7"

# Test dependencies (jqwik 1.10 also runs on the JUnit 6 platform)
junit = "6.1.3"
assertj = "3.27.7"
jqwik = "1.10.2"
jimfs = "1.3.2"
openapi-parser = "2026.2"
jmh = "1.37"

# Build-time tools
jsvg = "2.2.0"

# Build tooling
checkstyle = "14.3.0"
palantir-java-format = "2.102.0"
errorprone = "2.50.0"
spotbugs = "4.10.5"
findsecbugs = "1.14.0"
jacoco = "0.8.15"

[libraries]
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
jackson-core = { module = "tools.jackson.core:jackson-core", version.ref = "jackson" }
jackson-databind = { module = "tools.jackson.core:jackson-databind", version.ref = "jackson" }
jackson-dataformat-yaml = { module = "tools.jackson.dataformat:jackson-dataformat-yaml", version.ref = "jackson" }
json-schema-validator = { module = "com.networknt:json-schema-validator", version.ref = "json-schema-validator" }
jetty-bom = { module = "org.eclipse.jetty:jetty-bom", version.ref = "jetty" }
jetty-client = { module = "org.eclipse.jetty:jetty-client" }
jetty-server = { module = "org.eclipse.jetty:jetty-server" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }
logback-core = { module = "ch.qos.logback:logback-core", version.ref = "logback" }
javafx-controls = { module = "org.openjfx:javafx-controls", version.ref = "javafx" }
atlantafx-base = { module = "io.github.mkpaz:atlantafx-base", version.ref = "atlantafx" }
ikonli-javafx = { module = "org.kordamp.ikonli:ikonli-javafx", version.ref = "ikonli" }
ikonli-material2-pack = { module = "org.kordamp.ikonli:ikonli-material2-pack", version.ref = "ikonli" }
richtextfx = { module = "org.fxmisc.richtext:richtextfx", version.ref = "richtextfx" }
bouncycastle-prov = { module = "org.bouncycastle:bcprov-jdk18on", version.ref = "bouncycastle" }
guava = { module = "com.google.guava:guava", version.ref = "guava" }
picocli = { module = "info.picocli:picocli", version.ref = "picocli" }
errorprone-annotations = { module = "com.google.errorprone:error_prone_annotations", version.ref = "errorprone" }

junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }
jqwik = { module = "net.jqwik:jqwik", version.ref = "jqwik" }
jimfs = { module = "com.google.jimfs:jimfs", version.ref = "jimfs" }
openapi-parser = { module = "io.openapiprocessor:openapi-parser", version.ref = "openapi-parser" }
openapi-parser-jackson = { module = "io.openapiprocessor:io-jackson3", version.ref = "openapi-parser" }
jmh-core = { module = "org.openjdk.jmh:jmh-core", version.ref = "jmh" }
jmh-generator = { module = "org.openjdk.jmh:jmh-generator-annprocess", version.ref = "jmh" }
jsvg = { module = "com.github.weisj:jsvg", version.ref = "jsvg" }

errorprone-core = { module = "com.google.errorprone:error_prone_core", version.ref = "errorprone" }
findsecbugs = { module = "com.h3xstream.findsecbugs:findsecbugs-plugin", version.ref = "findsecbugs" }

# Gradle plugins applied by the convention plugins of build-logic
gradle-spotless = { module = "com.diffplug.spotless:spotless-plugin-gradle", version = "8.10.4" }
gradle-errorprone = { module = "net.ltgt.gradle:gradle-errorprone-plugin", version = "5.1.1" }
gradle-spotbugs = { module = "com.github.spotbugs.snom:spotbugs-gradle-plugin", version = "6.5.13" }

[plugins]
graalvm-native = { id = "org.graalvm.buildtools.native", version = "1.1.14" }
shadow = { id = "com.gradleup.shadow", version = "9.6.1" }
cyclonedx = { id = "org.cyclonedx.bom", version = "3.5.1" }
license-report = { id = "com.github.jk1.dependency-license-report", version = "3.1.4" }
dependency-check = { id = "org.owasp.dependencycheck", version = "13.0.0" }
sonarqube = { id = "org.sonarqube", version = "7.5.0.8588" }
