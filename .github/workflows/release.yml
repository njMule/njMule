# SPDX-FileCopyrightText: 2026 Salvatore Coppola and the njMule contributors
# SPDX-License-Identifier: GPL-3.0-or-later
#
# Native executables and installers for Windows x64 (MSI, zip; checked on arm64 too), Linux x64
# and arm64 (deb, rpm, tar.gz) and macOS arm64 (dmg). A pushed tag vX.Y.Z that matches the
# project version also opens a draft GitHub release with them, an SBOM and SHA-256 sums;
# publishing stays a manual step. A manual run only builds.
name: Release

on:
    push:
        tags: ["v*.*.*"]
    workflow_dispatch:

permissions:
    contents: read

env:
    GRAALVM_RELEASE: https://github.com/graalvm/graalvm-ce-builds/releases/download/graal-25.4.4.1.1
    GRAALVM_NAME: graalvm-community-jdk-25i4-25.0.4.1.1

jobs:
    version:
        name: version
        runs-on: ubuntu-latest
        outputs:
            version: ${{ steps.version.outputs.version }}
            numeric: ${{ steps.version.outputs.numeric }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
              with:
                  distribution: temurin
                  java-version: "25"
                  cache: maven
            - id: version
              name: Read the project version
              run: |
                  version="$(./mvnw -B -ntp -q help:evaluate -Dexpression=revision -DforceStdout)"
                  if [[ "${GITHUB_REF_TYPE}" == tag && "v${version}" != "${GITHUB_REF_NAME}" ]]; then
                      echo "Tag ${GITHUB_REF_NAME} does not match the version ${version}" >&2
                      exit 1
                  fi
                  echo "version=${version}" >> "$GITHUB_OUTPUT"
                  echo "numeric=${version%%-*}" >> "$GITHUB_OUTPUT"

    windows-x64:
        name: windows-x64
        needs: version
        runs-on: windows-latest
        env:
            VERSION: ${{ needs.version.outputs.version }}
            NUMERIC: ${{ needs.version.outputs.numeric }}
            GRAALVM_SHA256: 2733ea1331f1a98b05dd55a768b07347051dad48f030dbbfa191b11a2ccf4144
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
              with:
                  distribution: temurin
                  java-version: "25"
                  cache: maven
            - name: Install GraalVM and WiX
              shell: pwsh
              run: |
                  Invoke-WebRequest "$env:GRAALVM_RELEASE/$($env:GRAALVM_NAME)_windows-x64_bin.zip" -OutFile "$env:RUNNER_TEMP\graalvm.zip"
                  if ((Get-FileHash "$env:RUNNER_TEMP\graalvm.zip" -Algorithm SHA256).Hash -ne $env:GRAALVM_SHA256) {
                      throw "GraalVM checksum mismatch"
                  }
                  tar -xf "$env:RUNNER_TEMP\graalvm.zip" -C $env:RUNNER_TEMP
                  "GRAALVM_HOME=$env:RUNNER_TEMP\graalvm-community-25.4.4.1.1+1.1" >> $env:GITHUB_ENV
                  dotnet tool install --global wix --version 5.0.2
            - name: Build the native executables
              run: ./mvnw -B -ntp -Pnative -pl njmule-app,njmule-gui -am package -DskipTests
            - name: Smoke test
              shell: pwsh
              run: |
                  njmule-app/target/njmule.exe --version
                  $tour = "$env:RUNNER_TEMP\tour"
                  Copy-Item -Recurse njmule-gui/native/tour $tour
                  $gui = Start-Process njmule-gui/target/native/njmule-gui.exe -ArgumentList @("-Dnjmule.gui.tour=true", "--config-dir", $tour) -PassThru
                  if (-not $gui.WaitForExit(180000)) { $gui.Kill(); throw "the GUI tour did not finish" }
                  if (-not (Select-String -Quiet "Tour finished" "$tour\logs\*.log")) { throw "the GUI tour failed" }
            - name: Pack
              shell: pwsh
              run: |
                  $name = "njmule-$env:VERSION-windows-x64"
                  New-Item -ItemType Directory -Force "stage\$name", dist | Out-Null
                  Copy-Item njmule-app/target/njmule.exe, njmule-gui/target/native/* "stage\$name"
                  # Absolute paths: WiX resolves relative ones from the .wxs file's directory.
                  $bin = (Resolve-Path "stage\$name").Path
                  $docs = (Resolve-Path .).Path
                  wix build packaging/windows/njmule.wxs -wx -arch x64 -d "Version=$env:NUMERIC" -d "BinDir=$bin" -d "DocDir=$docs" -d Gui=yes -o "dist\$name.msi"
                  # The installer must carry the programs: unpack it and look.
                  wix msi decompile "dist\$name.msi" -x "$env:RUNNER_TEMP\msi" -o "$env:RUNNER_TEMP\msi.wxs"
                  foreach ($exe in "njmule.exe", "njmule-gui.exe") {
                      if (-not (Select-String -Quiet -SimpleMatch $exe "$env:RUNNER_TEMP\msi.wxs")) { throw "$exe is missing from the MSI" }
                  }
                  if (-not (Select-String -Quiet -SimpleMatch "--restore-links" "$env:RUNNER_TEMP\msi.wxs")) { throw "the uninstaller does not give the ed2k links back" }
                  Copy-Item LICENSE, NOTICE, README.md, CHANGELOG.md "stage\$name"
                  Compress-Archive -Path "stage\$name" -DestinationPath "dist\$name.zip"
            - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: windows-x64
                  path: dist/

    linux:
        name: linux-${{ matrix.arch }}
        needs: version
        strategy:
            matrix:
                include:
                    - arch: x64
                      runner: ubuntu-24.04
                      deb: amd64
                      graalvm: linux-x64
                      graalvm-sha256: 05ccbbe783210b6886ff7b08fcd0b061c5dce4852b05db87284fc0e24abb08e2
                      nfpm: Linux_x86_64
                      nfpm-sha256: 6d7f9a28b2f397934403950fcbba83f598b08d02edbe79a0815b3b4897341750
                    - arch: arm64
                      runner: ubuntu-24.04-arm
                      deb: arm64
                      graalvm: linux-aarch64
                      graalvm-sha256: e5f5e2f59643cf96765c741dc00b206f86c69c8c1bf843fe26050c871e0e2dbc
                      nfpm: Linux_arm64
                      nfpm-sha256: a9a75213763783b7669719e505474c748c5ad7dc66591a195619deb50f85c2f4
        runs-on: ${{ matrix.runner }}
        env:
            VERSION: ${{ needs.version.outputs.version }}
            ARCH: ${{ matrix.deb }}
            GRAALVM_SHA256: ${{ matrix.graalvm-sha256 }}
            NFPM_URL: https://github.com/goreleaser/nfpm/releases/download/v2.48.0/nfpm_2.48.0_${{ matrix.nfpm }}.tar.gz
            NFPM_SHA256: ${{ matrix.nfpm-sha256 }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - name: Install GraalVM, GTK and nfpm
              run: |
                  sudo apt-get update -qq
                  sudo apt-get install -y -qq --no-install-recommends build-essential zlib1g-dev \
                      xvfb libgtk-3-0t64 libxtst6 libgl1 libglx-mesa0 libgl1-mesa-dri fonts-dejavu-core
                  curl --proto =https --tlsv1.2 -sSfL -o "$RUNNER_TEMP/graalvm.tar.gz" \
                      "$GRAALVM_RELEASE/${GRAALVM_NAME}_${{ matrix.graalvm }}_bin.tar.gz"
                  echo "$GRAALVM_SHA256  $RUNNER_TEMP/graalvm.tar.gz" | sha256sum -c -
                  mkdir -p "$RUNNER_TEMP/graalvm"
                  tar -C "$RUNNER_TEMP/graalvm" --strip-components=1 -xzf "$RUNNER_TEMP/graalvm.tar.gz"
                  echo "GRAALVM_HOME=$RUNNER_TEMP/graalvm" >> "$GITHUB_ENV"
                  echo "JAVA_HOME=$RUNNER_TEMP/graalvm" >> "$GITHUB_ENV"
                  curl --proto =https --tlsv1.2 -sSfL -o "$RUNNER_TEMP/nfpm.tar.gz" "$NFPM_URL"
                  echo "$NFPM_SHA256  $RUNNER_TEMP/nfpm.tar.gz" | sha256sum -c -
                  tar -C "$RUNNER_TEMP" -xzf "$RUNNER_TEMP/nfpm.tar.gz" nfpm
            - name: Build the native executables
              run: ./mvnw -B -ntp -Pnative -pl njmule-app,njmule-gui -am package -DskipTests
            - name: Smoke test
              run: |
                  njmule-app/target/njmule --version
                  tour="$RUNNER_TEMP/tour"
                  cp -r njmule-gui/native/tour "$tour"
                  timeout 180 xvfb-run -a njmule-gui/target/native/njmule-gui -Dnjmule.gui.tour=true --config-dir "$tour"
                  grep -q "Tour finished" "$tour"/logs/*.log
            - name: Pack
              run: |
                  name="njmule-${VERSION}-linux-${{ matrix.arch }}"
                  mkdir -p stage/gui stage/doc dist "archive/${name}/share"
                  install -m 755 njmule-app/target/njmule stage/njmule
                  cp -r njmule-gui/target/native/. stage/gui/
                  cp README.md CHANGELOG.md NOTICE stage/doc/
                  "$RUNNER_TEMP/nfpm" package -f packaging/linux/nfpm.yaml -p deb -t dist/
                  "$RUNNER_TEMP/nfpm" package -f packaging/linux/nfpm.yaml -p rpm -t dist/
                  cp -r stage/njmule stage/gui/. LICENSE NOTICE README.md CHANGELOG.md "archive/${name}/"
                  cp packaging/linux/org.njmule.njMule.* branding/njmule-icon.svg "archive/${name}/share/"
                  tar -C archive -czf "dist/${name}.tar.gz" "${name}"
            - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: linux-${{ matrix.arch }}
                  path: dist/

    # GraalVM and JavaFX have no Windows arm64 build yet: the x64 installer runs there under the
    # system's x64 emulation, which this job checks on an arm64 runner.
    windows-arm64:
        name: windows-arm64 (x64 under emulation)
        needs: [version, windows-x64]
        runs-on: windows-11-arm
        permissions:
            actions: read
            contents: read
        env:
            VERSION: ${{ needs.version.outputs.version }}
        steps:
            - name: Fetch the x64 installer
              env:
                  GH_TOKEN: ${{ github.token }}
              run: gh run download "$env:GITHUB_RUN_ID" --repo "$env:GITHUB_REPOSITORY" --name windows-x64 --dir dist
            - name: Install, run and uninstall
              shell: pwsh
              run: |
                  $msi = (Resolve-Path "dist\njmule-$env:VERSION-windows-x64.msi").Path
                  $log = "$env:RUNNER_TEMP\install.log"
                  $p = Start-Process msiexec.exe -ArgumentList @("/i", "`"$msi`"", "/qn", "/l*v", "`"$log`"") -PassThru -Wait
                  if ($p.ExitCode -ne 0) { throw "install failed: $($p.ExitCode)" }
                  # Per user, or for all users when the account is an administrator.
                  $dir = (Get-ItemProperty HKCU:\Software\njMule).InstallFolder
                  "Installed in $dir"
                  if (-not (Test-Path (Join-Path $dir "njmule.exe"))) {
                      Get-ChildItem $dir -ErrorAction SilentlyContinue | Format-Table Name, Length
                      Select-String -Path $log -Pattern "njmule.exe|INSTALLFOLDER|ProgramFiles" | Select-Object -First 40
                      throw "njmule.exe is not where the installer put the programs"
                  }
                  & (Join-Path $dir "njmule.exe") --version
                  $tour = "$env:RUNNER_TEMP\tour"
                  New-Item -ItemType Directory -Force "$tour\config" | Out-Null
                  Set-Content "$tour\config\njmule.properties" "net.ed2k.enabled=false`nnet.kad.enabled=false`nnet.upnp=false"
                  $gui = Start-Process (Join-Path $dir "njmule-gui.exe") -ArgumentList @("-Dnjmule.gui.tour=true", "--config-dir", $tour) -PassThru
                  if (-not $gui.WaitForExit(300000)) { $gui.Kill(); throw "the GUI tour did not finish" }
                  if (-not (Select-String -Quiet "Tour finished" "$tour\logs\*.log")) { throw "the GUI tour failed" }
                  # As if the desktop app had taken the ed2k links from another program: the
                  # uninstaller must give them back.
                  $command = "HKCU:\Software\Classes\ed2k\shell\open\command"
                  New-Item -Force $command | Out-Null
                  Set-Item $command -Value "`"$(Join-Path $dir "njmule-gui.exe")`" `"%1`""
                  $config = Join-Path $env:APPDATA "njMule\config"
                  New-Item -ItemType Directory -Force $config | Out-Null
                  Set-Content -Encoding Unicode (Join-Path $config "ed2k-handler-backup.reg") "Windows Registry Editor Version 5.00`r`n`r`n[HKEY_CURRENT_USER\Software\Classes\ed2k\shell\open\command]`r`n@=`"previous.exe %1`"`r`n"
                  $p = Start-Process msiexec.exe -ArgumentList @("/x", "`"$msi`"", "/qn") -PassThru -Wait
                  if ($p.ExitCode -ne 0) { throw "uninstall failed: $($p.ExitCode)" }
                  $key = Get-Item $command -ErrorAction SilentlyContinue
                  $after = if ($key) { $key.GetValue("") } else { "no ed2k key" }
                  if ($after -ne "previous.exe %1") { throw "the uninstaller did not give the ed2k links back: $after" }

    macos-arm64:
        name: macos-arm64
        needs: version
        runs-on: macos-latest
        env:
            VERSION: ${{ needs.version.outputs.version }}
            GRAALVM_SHA256: 4ec9932aa4aab1afca0ea31982d32d6f956615c61fe21a227b49756b25adda4f
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - name: Install GraalVM
              run: |
                  curl --proto =https --tlsv1.2 -sSfL -o "$RUNNER_TEMP/graalvm.tar.gz" "$GRAALVM_RELEASE/${GRAALVM_NAME}_macos-aarch64_bin.tar.gz"
                  echo "$GRAALVM_SHA256  $RUNNER_TEMP/graalvm.tar.gz" | shasum -a 256 -c -
                  mkdir -p "$RUNNER_TEMP/graalvm"
                  tar -C "$RUNNER_TEMP/graalvm" --strip-components=1 -xzf "$RUNNER_TEMP/graalvm.tar.gz"
                  echo "GRAALVM_HOME=$RUNNER_TEMP/graalvm/Contents/Home" >> "$GITHUB_ENV"
                  echo "JAVA_HOME=$RUNNER_TEMP/graalvm/Contents/Home" >> "$GITHUB_ENV"
            # The committed metadata comes from Windows and Linux: the tour adds macOS's first.
            - name: Trace the GUI tour
              run: ./mvnw -B -ntp -Pnative-tour -pl njmule-gui -am package -DskipTests
            - name: Build the native executables
              run: ./mvnw -B -ntp -Pnative -pl njmule-app,njmule-gui -am package -DskipTests
            - name: Smoke test
              run: |
                  njmule-app/target/njmule --version
                  tour="$RUNNER_TEMP/tour"
                  cp -r njmule-gui/native/tour "$tour"
                  njmule-gui/target/native/njmule-gui -Dnjmule.gui.tour=true -Dprism.verbose=true \
                      --config-dir "$tour" > "$RUNNER_TEMP/gui.out" 2>&1 &
                  gui=$!
                  ( sleep 180 && kill -QUIT "$gui" && sleep 5 && kill "$gui" ) 2>/dev/null &
                  wait "$gui" || true
                  if ! grep -q "Tour finished" "$tour"/logs/*.log; then
                      cat "$RUNNER_TEMP/gui.out"
                      cat "$tour"/logs/*.log
                      exit 1
                  fi
            - name: Pack
              run: |
                  app=stage/njMule.app/Contents
                  mkdir -p "$app/MacOS" "$app/Resources" dist
                  cp -R njmule-gui/target/native/. "$app/MacOS/"
                  cp njmule-app/target/njmule "$app/MacOS/"
                  cp branding/generated/njmule.icns "$app/Resources/"
                  sed "s/@VERSION@/${VERSION%%-*}/g" packaging/macos/Info.plist > "$app/Info.plist"
                  plutil -lint "$app/Info.plist"
                  codesign --force --deep --sign - stage/njMule.app
                  ln -s /Applications stage/Applications
                  hdiutil create -volname njMule -srcfolder stage -ov -format UDZO \
                      "dist/njmule-${VERSION}-macos-arm64.dmg"
            - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: macos-arm64
                  path: dist/

    release:
        name: draft release
        if: github.ref_type == 'tag'
        needs: [version, windows-x64, windows-arm64, linux, macos-arm64]
        runs-on: ubuntu-latest
        permissions:
            actions: read
            contents: write
        env:
            VERSION: ${{ needs.version.outputs.version }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
              with:
                  distribution: temurin
                  java-version: "25"
                  cache: maven
            - name: Software bill of materials
              run: ./mvnw -B -ntp -Plicenses package -DskipTests
            - name: Collect the packages
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  gh run download "${GITHUB_RUN_ID}" --dir packages
                  mkdir -p dist
                  find packages -type f -exec cp {} dist/ \;
                  cp target/bom.json "dist/njmule-${VERSION}-sbom.cdx.json"
                  (cd dist && sha256sum -- * > SHA256SUMS)
            - name: Create the draft release
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  flags=(--draft --verify-tag --title "njMule ${GITHUB_REF_NAME}")
                  if [[ "${VERSION}" == *-* ]]; then
                      flags+=(--prerelease)
                  fi
                  awk -v v="${VERSION}" \
                      '$0 ~ "^## \\[" v "\\]" {on=1; next} on && /^## \[/ {exit} on' \
                      CHANGELOG.md > notes.md
                  gh release create "${GITHUB_REF_NAME}" "${flags[@]}" --notes-file notes.md dist/*
