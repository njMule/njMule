# SPDX-License-Identifier: GPL-3.0-or-later
#
# Native executables and installers for Windows x64 (MSI, zip; checked on arm64 too), Linux x64
# and arm64 (deb, rpm, tar.xz; a static headless tar.xz for x64), macOS arm64 (dmg), Synology
# DSM x86_64 (spk) and a Docker image (linux/amd64, linux/arm64). Each desktop package carries one
# native executable: on Linux and macOS njmule, the command line, is a script that runs njmule-gui
# headless (packaging/njmule.sh); on Windows the executable is the console program njmule.exe, which
# njmule-gui.exe, a small GUI program, starts for the desktop (as javaw.exe stands for java.exe).
# A pushed tag vX.Y.Z that matches the project version also opens a draft GitHub release with
# them, an SBOM, SHA-256 sums and njmule-update.json (what the update check of njMule reads), both
# signed with minisign, and notes that link each package's VirusTotal report, and pushes the image
# to ghcr.io/njmule/njmule; publishing the release stays a manual step. A manual run builds, then
# checks that a test build updates itself to the packages built (the e2e jobs). Each package says
# in install.properties how it was installed, which tells the update check what to offer and how
# njMule installs it.
name: Release

on:
    push:
        tags: ["v*.*.*"]
    workflow_dispatch:

permissions:
    contents: read

env:
    GRAALVM_RELEASE: https://github.com/graalvm/graalvm-ce-builds/releases/download/graal-25.4.4.1.1
    GRAALVM_NAME: graalvm-community-jdk-25i4-25.0.4.1.1

jobs:
    version:
        name: version
        runs-on: ubuntu-latest
        outputs:
            version: ${{ steps.version.outputs.version }}
            numeric: ${{ steps.version.outputs.numeric }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - id: version
              name: Read the project version
              run: |
                  version="$(sed -n 's/^version=//p' gradle.properties)"
                  if [[ "${GITHUB_REF_TYPE}" == tag && "v${version}" != "${GITHUB_REF_NAME}" ]]; then
                      echo "Tag ${GITHUB_REF_NAME} does not match the version ${version}" >&2
                      exit 1
                  fi
                  echo "version=${version}" >> "$GITHUB_OUTPUT"
                  echo "numeric=${version%%-*}" >> "$GITHUB_OUTPUT"

    windows-x64:
        name: windows-x64
        needs: version
        runs-on: windows-latest
        env:
            VERSION: ${{ needs.version.outputs.version }}
            NUMERIC: ${{ needs.version.outputs.numeric }}
            GRAALVM_SHA256: 2733ea1331f1a98b05dd55a768b07347051dad48f030dbbfa191b11a2ccf4144
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
              with:
                  distribution: temurin
                  java-version: "25"
            - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
              with:
                  cache-provider: basic
            - name: Install GraalVM and WiX
              shell: pwsh
              run: |
                  Invoke-WebRequest "$env:GRAALVM_RELEASE/$($env:GRAALVM_NAME)_windows-x64_bin.zip" -OutFile "$env:RUNNER_TEMP\graalvm.zip"
                  if ((Get-FileHash "$env:RUNNER_TEMP\graalvm.zip" -Algorithm SHA256).Hash -ne $env:GRAALVM_SHA256) {
                      throw "GraalVM checksum mismatch"
                  }
                  tar -xf "$env:RUNNER_TEMP\graalvm.zip" -C $env:RUNNER_TEMP
                  "GRAALVM_HOME=$env:RUNNER_TEMP\graalvm-community-25.4.4.1.1+1.1" >> $env:GITHUB_ENV
                  dotnet tool install --global wix --version 5.0.2
            # Releases always get the full optimization, never the quick -Ob of the CI checks.
            - name: Build the native executable, its launcher and the service
              run: ./gradlew :njmule-gui:nativeGui :njmule-gui:nativeLauncher :njmule-gui:nativeService '-Pnative.optimization=-O2'
            - name: Smoke test
              shell: pwsh
              run: |
                  Copy-Item njmule-gui/build/launcher/njmule-gui.exe, njmule-gui/build/launcher/njmule-service.exe njmule-gui/build/native/
                  njmule-gui/build/native/njmule.exe --version
                  $tour = "$env:RUNNER_TEMP\tour"
                  Copy-Item -Recurse njmule-gui/native/tour $tour
                  $gui = Start-Process njmule-gui/build/native/njmule-gui.exe -ArgumentList @("-Dnjmule.gui.tour=true", "--config-dir", $tour) -PassThru
                  if (-not $gui.WaitForExit(180000)) { $gui.Kill(); throw "the GUI tour did not finish" }
                  if (-not (Select-String -Quiet "Tour finished" "$tour\logs\*.log")) { throw "the GUI tour failed" }
            # The runner is an administrator: the service is installed, answers on its web interface and is
            # removed again; build.yml runs the same script on pull requests.
            - name: Service test
              shell: pwsh
              run: ./.github/scripts/windows-service-test.ps1 njmule-gui/build/native/njmule.exe
            - name: Pack
              shell: pwsh
              run: |
                  $name = "njmule-$env:VERSION-windows-x64"
                  New-Item -ItemType Directory -Force "stage\$name", dist | Out-Null
                  Copy-Item njmule-gui/build/native/* "stage\$name"
                  # Absolute paths: WiX resolves relative ones from the .wxs file's directory.
                  $bin = (Resolve-Path "stage\$name").Path
                  $docs = (Resolve-Path .).Path
                  wix build packaging/windows/njmule.wxs -wx -arch x64 -pdbtype none -d "Version=$env:NUMERIC" -d "BinDir=$bin" -d "DocDir=$docs" -d Gui=yes -o "dist\$name.msi"
                  # The installer must carry the programs: unpack it and look.
                  wix msi decompile "dist\$name.msi" -x "$env:RUNNER_TEMP\msi" -o "$env:RUNNER_TEMP\msi.wxs"
                  foreach ($exe in "njmule.exe", "njmule-gui.exe", "njmule-service.exe", "install.properties") {
                      if (-not (Select-String -Quiet -SimpleMatch $exe "$env:RUNNER_TEMP\msi.wxs")) { throw "$exe is missing from the MSI" }
                  }
                  if (-not (Select-String -Quiet -SimpleMatch "--restore-links" "$env:RUNNER_TEMP\msi.wxs")) { throw "the uninstaller does not give the ed2k links back" }
                  Copy-Item LICENSE, NOTICE, README.md, CHANGELOG.md "stage\$name"
                  Set-Content -Encoding ascii "stage\$name\install.properties" "kind=zip"
                  Compress-Archive -Path "stage\$name" -DestinationPath "dist\$name.zip"
            # The installer for every user sets the service up, which starts and answers; uninstalling removes it and
            # keeps its profile.
            - name: Installer service test
              shell: pwsh
              run: |
                  $msi = (Resolve-Path "dist\njmule-$env:VERSION-windows-x64.msi").Path
                  $data = Join-Path $env:ProgramData njMule
                  New-Item -ItemType Directory -Force (Join-Path $data config) | Out-Null
                  Set-Content -Encoding ascii (Join-Path $data "config\njmule.properties") "net.ed2k.enabled=false`nnet.kad.enabled=false`nnet.upnp=false"
                  $password = "$env:RUNNER_TEMP\service-password"
                  Set-Content -Encoding ascii $password "service-test-password"
                  $log = "$env:RUNNER_TEMP\service-install.log"
                  $p = Start-Process msiexec.exe -Wait -PassThru -ArgumentList @(
                      "/i", "`"$msi`"", "/qn", 'MSIINSTALLPERUSER=""', "NJMULE_SERVICE=1",
                      "NJMULE_WEBUI_PASSWORD_FILE=`"$password`"", "/l*v", "`"$log`"")
                  if ($p.ExitCode -ne 0) {
                      Select-String -Path $log -Pattern "InstallService|njmule.exe|Return value 3" | Select-Object -Last 40
                      throw "install for every user failed: $($p.ExitCode)"
                  }
                  if (-not (Get-Service njMule -ErrorAction SilentlyContinue)) { throw "the installer did not set the service up" }
                  $answered = $false
                  foreach ($i in 1..60) {
                      try { Invoke-WebRequest -UseBasicParsing http://127.0.0.1:4711/login | Out-Null; $answered = $true; break } catch { Start-Sleep 1 }
                  }
                  if (-not $answered) { throw "the service's web interface does not answer" }
                  if ((Get-Service njMule).Status -ne "Running") { throw "the service does not run" }
                  $p = Start-Process msiexec.exe -Wait -PassThru -ArgumentList @(
                      "/x", "`"$msi`"", "/qn", "/l*v", "`"$env:RUNNER_TEMP\service-uninstall.log`"")
                  if ($p.ExitCode -ne 0) { throw "uninstall failed: $($p.ExitCode)" }
                  if (Get-Service njMule -ErrorAction SilentlyContinue) { throw "the uninstaller left the service" }
                  if (-not (Test-Path (Join-Path $data "config\njmule.properties"))) { throw "the uninstaller took the service's profile" }
                  Remove-Item -Recurse -Force $data
            - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: windows-x64
                  path: dist/
            # The basic cache provider saves Gradle's user home without stopping the daemon, whose lock
            # files Windows does not let it read.
            - name: Stop Gradle
              if: always()
              run: ./gradlew --stop

    linux:
        name: linux-${{ matrix.arch }}
        needs: version
        strategy:
            matrix:
                include:
                    - arch: x64
                      runner: ubuntu-24.04
                      deb: amd64
                      graalvm: linux-x64
                      graalvm-sha256: 05ccbbe783210b6886ff7b08fcd0b061c5dce4852b05db87284fc0e24abb08e2
                      nfpm: Linux_x86_64
                      nfpm-sha256: 6d7f9a28b2f397934403950fcbba83f598b08d02edbe79a0815b3b4897341750
                    - arch: arm64
                      runner: ubuntu-24.04-arm
                      deb: arm64
                      graalvm: linux-aarch64
                      graalvm-sha256: e5f5e2f59643cf96765c741dc00b206f86c69c8c1bf843fe26050c871e0e2dbc
                      nfpm: Linux_arm64
                      nfpm-sha256: a9a75213763783b7669719e505474c748c5ad7dc66591a195619deb50f85c2f4
        runs-on: ${{ matrix.runner }}
        env:
            VERSION: ${{ needs.version.outputs.version }}
            ARCH: ${{ matrix.deb }}
            GRAALVM_SHA256: ${{ matrix.graalvm-sha256 }}
            NFPM_URL: https://github.com/goreleaser/nfpm/releases/download/v2.48.0/nfpm_2.48.0_${{ matrix.nfpm }}.tar.gz
            NFPM_SHA256: ${{ matrix.nfpm-sha256 }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - name: Install GraalVM, GTK and nfpm
              run: |
                  sudo apt-get update -qq
                  sudo apt-get install -y -qq --no-install-recommends build-essential zlib1g-dev \
                      xvfb libgtk-3-0t64 libxtst6 libgl1 libglx-mesa0 libgl1-mesa-dri fonts-dejavu-core
                  curl --proto =https --tlsv1.2 -sSfL -o "$RUNNER_TEMP/graalvm.tar.gz" \
                      "$GRAALVM_RELEASE/${GRAALVM_NAME}_${{ matrix.graalvm }}_bin.tar.gz"
                  echo "$GRAALVM_SHA256  $RUNNER_TEMP/graalvm.tar.gz" | sha256sum -c -
                  mkdir -p "$RUNNER_TEMP/graalvm"
                  tar -C "$RUNNER_TEMP/graalvm" --strip-components=1 -xzf "$RUNNER_TEMP/graalvm.tar.gz"
                  echo "GRAALVM_HOME=$RUNNER_TEMP/graalvm" >> "$GITHUB_ENV"
                  echo "JAVA_HOME=$RUNNER_TEMP/graalvm" >> "$GITHUB_ENV"
                  curl --proto =https --tlsv1.2 -sSfL -o "$RUNNER_TEMP/nfpm.tar.gz" "$NFPM_URL"
                  echo "$NFPM_SHA256  $RUNNER_TEMP/nfpm.tar.gz" | sha256sum -c -
                  tar -C "$RUNNER_TEMP" -xzf "$RUNNER_TEMP/nfpm.tar.gz" nfpm
            - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
              with:
                  cache-provider: basic
            # Releases always get the full optimization, never the quick -Ob of the CI checks.
            - name: Build the native executables
              run: ./gradlew :njmule-app:nativeCompile :njmule-gui:nativeGui '-Pnative.optimization=-O2'
            - name: Smoke test
              run: |
                  njmule-app/build/native/nativeCompile/njmule --version
                  tour="$RUNNER_TEMP/tour"
                  cp -r njmule-gui/native/tour "$tour"
                  timeout 180 xvfb-run -a njmule-gui/build/native/njmule-gui -Dnjmule.gui.tour=true --config-dir "$tour"
                  grep -q "Tour finished" "$tour"/logs/*.log
            - name: Pack
              run: |
                  name="njmule-${VERSION}-linux-${{ matrix.arch }}"
                  mkdir -p stage/gui stage/doc dist headless "archive/${name}/share"
                  cp -r njmule-gui/build/native/. stage/gui/
                  cp README.md CHANGELOG.md NOTICE stage/doc/
                  "$RUNNER_TEMP/nfpm" package -f packaging/linux/nfpm.yaml -p deb -t dist/
                  "$RUNNER_TEMP/nfpm" package -f packaging/linux/nfpm.yaml -p rpm -t dist/
                  install -m 755 packaging/njmule.sh "archive/${name}/njmule"
                  cp -r stage/gui/. LICENSE NOTICE README.md CHANGELOG.md "archive/${name}/"
                  cp packaging/linux/org.njmule.njMule.* branding/njmule-icon.svg "archive/${name}/share/"
                  printf 'kind=tar\n' > "archive/${name}/install.properties"
                  # The command line runs the desktop executable headless.
                  "archive/${name}/njmule" --version
                  tar -C archive -cJf "dist/${name}.tar.xz" "${name}"
                  # The headless executable alone goes into the Docker image only.
                  install -m 755 njmule-app/build/native/nativeCompile/njmule headless/njmule
            - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: linux-${{ matrix.arch }}
                  path: dist/
            - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: headless-linux-${{ matrix.arch }}
                  path: headless/

    # The Synology DSM 7 package for x86_64 models, and the same executable alone for any x64 Linux:
    # the headless engine built fully static with musl, as DSM's glibc is too old for the Linux
    # executable, wrapped by packaging/synology/build-spk.sh.
    synology:
        name: synology-x86_64
        needs: version
        runs-on: ubuntu-24.04
        env:
            VERSION: ${{ needs.version.outputs.version }}
            GRAALVM_SHA256: 05ccbbe783210b6886ff7b08fcd0b061c5dce4852b05db87284fc0e24abb08e2
            MUSL_URL: https://gds.oracle.com/download/bfs/archive/musl-toolchain-1.2.5-oracle-00001-linux-amd64.tar.gz
            MUSL_SHA256: 77a60e1d31303f214e1c9d8e5843abcce2743a0c6f6b436e251f69a3161801ad
        steps:
            # Every commit: DSM wants the build number of a package to grow, and takes their count.
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0
            - name: Install GraalVM and the musl toolchain
              run: |
                  curl --proto =https --tlsv1.2 -sSfL -o "$RUNNER_TEMP/graalvm.tar.gz" \
                      "$GRAALVM_RELEASE/${GRAALVM_NAME}_linux-x64_bin.tar.gz"
                  echo "$GRAALVM_SHA256  $RUNNER_TEMP/graalvm.tar.gz" | sha256sum -c -
                  mkdir -p "$RUNNER_TEMP/graalvm"
                  tar -C "$RUNNER_TEMP/graalvm" --strip-components=1 -xzf "$RUNNER_TEMP/graalvm.tar.gz"
                  echo "GRAALVM_HOME=$RUNNER_TEMP/graalvm" >> "$GITHUB_ENV"
                  echo "JAVA_HOME=$RUNNER_TEMP/graalvm" >> "$GITHUB_ENV"
                  curl --proto =https --tlsv1.2 -sSfL -o "$RUNNER_TEMP/musl.tar.gz" "$MUSL_URL"
                  echo "$MUSL_SHA256  $RUNNER_TEMP/musl.tar.gz" | sha256sum -c -
                  tar -C "$RUNNER_TEMP" -xzf "$RUNNER_TEMP/musl.tar.gz"
                  echo "$RUNNER_TEMP/musl-toolchain/bin" >> "$GITHUB_PATH"
            - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
              with:
                  cache-provider: basic
            - name: Build the static executable
              run: ./gradlew :njmule-app:nativeCompile '-Pnative.static=musl' '-Pnative.optimization=-O2'
            - name: Smoke test
              run: |
                  exe=njmule-app/build/native/nativeCompile/njmule
                  if ldd "$exe"; then
                      echo "njmule links to libraries of the system" >&2
                      exit 1
                  fi
                  "$exe" --version
            - name: Pack
              run: |
                  mkdir -p build/synology dist
                  SPK_BUILD="$(git rev-list --count HEAD)" packaging/synology/build-spk.sh \
                      njmule-app/build/native/nativeCompile/njmule x86_64 build/synology
                  mv build/synology/*.spk "dist/njmule-${VERSION}-synology-x86_64.spk"
                  # The same executable alone, for any x64 Linux whatever its libc (old glibc, musl).
                  name="njmule-${VERSION}-linux-x64-static"
                  mkdir -p "archive/${name}"
                  install -m 755 njmule-app/build/native/nativeCompile/njmule "archive/${name}/njmule"
                  cp LICENSE NOTICE README.md CHANGELOG.md packaging/synology/licenses/musl-COPYRIGHT \
                      packaging/synology/licenses/zlib-LICENSE "archive/${name}/"
                  printf 'kind=static-tar\n' > "archive/${name}/install.properties"
                  tar -C archive -cJf "dist/${name}.tar.xz" "${name}"
            - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: synology-x86_64
                  path: dist/
            # The amd64 Docker image takes it too.
            - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: headless-linux-x64-static
                  path: njmule-app/build/native/nativeCompile/njmule

    # The headless engine with its web interface as a Docker image for linux/amd64 (the static
    # executable of the Synology job) and linux/arm64 (the Linux job's), with no emulation and no
    # second compilation. The amd64 image is tried first; a tag pushes both to the GitHub Container
    # Registry.
    docker:
        name: docker image
        needs: [version, linux, synology]
        runs-on: ubuntu-24.04
        permissions:
            actions: read
            contents: read
            packages: write
        env:
            VERSION: ${{ needs.version.outputs.version }}
            IMAGE: ghcr.io/njmule/njmule
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - name: Fetch the Linux executables
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  gh run download "${GITHUB_RUN_ID}" --repo "${GITHUB_REPOSITORY}" \
                      --name headless-linux-x64-static --name headless-linux-arm64 --dir "$RUNNER_TEMP/headless"
                  for pair in x64-static:amd64 arm64:arm64; do
                      install -D -m 755 "$RUNNER_TEMP/headless/headless-linux-${pair%%:*}/njmule" \
                          "$RUNNER_TEMP/binary/${pair##*:}/njmule"
                  done
                  file "$RUNNER_TEMP"/binary/*/njmule
            - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
            - id: meta
              uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
              env:
                  # The description shows on the registry page of a multi-platform image.
                  DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
              with:
                  images: ${{ env.IMAGE }}
                  # A pre-release gets its version only; a release also X.Y and latest.
                  tags: |
                      type=semver,pattern={{version}},value=v${{ env.VERSION }}
                      type=semver,pattern={{major}}.{{minor}},value=v${{ env.VERSION }}
                  labels: |
                      org.opencontainers.image.title=njMule
                      org.opencontainers.image.description=eMule-compatible eD2K and Kad client: headless engine with web interface
                      org.opencontainers.image.licenses=GPL-3.0-or-later
                  annotations: |
                      org.opencontainers.image.title=njMule
                      org.opencontainers.image.description=eMule-compatible eD2K and Kad client: headless engine with web interface
                      org.opencontainers.image.licenses=GPL-3.0-or-later
            - name: Build the amd64 image
              uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
              with:
                  context: .
                  file: packaging/docker/Dockerfile
                  build-contexts: binary=${{ runner.temp }}/binary
                  platforms: linux/amd64
                  load: true
                  tags: njmule:smoke
            # Started as the runner's user with all its data in one directory, networks off: the web
            # interface takes the password of the secret and only that, and SIGTERM stops it cleanly.
            - name: Smoke test
              run: |
                  docker run --rm njmule:smoke --version
                  data="$RUNNER_TEMP/njmule"
                  mkdir -p "$data/config"
                  printf 'net.ed2k.enabled=false\nnet.kad.enabled=false\nnet.upnp=false\n' > "$data/config/njmule.properties"
                  printf 'smoke-test-password\n' > "$RUNNER_TEMP/webui_password"
                  docker run -d --name njmule --user "$(id -u):$(id -g)" -p 127.0.0.1:4711:4711 -v "$data:/njmule" \
                      -v "$RUNNER_TEMP/webui_password:/run/secrets/njmule_webui_password:ro" njmule:smoke
                  for _ in $(seq 60); do
                      curl -fsS -o /dev/null http://127.0.0.1:4711/login && break
                      sleep 1
                  done
                  login() {
                      curl -s -o /dev/null -w '%{http_code}' -c "$RUNNER_TEMP/cookies" \
                          --data-urlencode "password=$1" http://127.0.0.1:4711/login
                  }
                  test "$(login wrong-password)" = 401
                  test "$(login smoke-test-password)" = 303
                  # The session gets the browser app and its calls to the API.
                  curl -fsS -b "$RUNNER_TEMP/cookies" http://127.0.0.1:4711/ | grep -q 'name="njmule-csrf"'
                  curl -fsS -b "$RUNNER_TEMP/cookies" http://127.0.0.1:4711/api/v1/status | grep -q '"tcpPort"'
                  docker stop --timeout 30 njmule
                  docker logs njmule > "$RUNNER_TEMP/njmule.log" 2>&1
                  cat "$RUNNER_TEMP/njmule.log"
                  test "$(docker inspect --format '{{.State.ExitCode}}' njmule)" = 143
                  grep -q "Stopping njMule" "$RUNNER_TEMP/njmule.log"
                  if grep -rq "smoke-test-password" "$RUNNER_TEMP/njmule.log" "$data/logs"; then
                      echo "The password shows in the log" >&2
                      exit 1
                  fi
            - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
              if: github.ref_type == 'tag'
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ github.token }}
            - name: Build both platforms (push for a tag)
              uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
              with:
                  context: .
                  file: packaging/docker/Dockerfile
                  build-contexts: binary=${{ runner.temp }}/binary
                  platforms: linux/amd64,linux/arm64
                  push: ${{ github.ref_type == 'tag' }}
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  annotations: ${{ steps.meta.outputs.annotations }}
                  provenance: mode=max
                  sbom: true

    # GraalVM and JavaFX have no Windows arm64 build yet: the x64 installer runs there under the
    # system's x64 emulation, which this job checks on an arm64 runner.
    windows-arm64:
        name: windows-arm64 (x64 under emulation)
        needs: [version, windows-x64]
        runs-on: windows-11-arm
        permissions:
            actions: read
            contents: read
        env:
            VERSION: ${{ needs.version.outputs.version }}
        steps:
            - name: Fetch the x64 installer
              env:
                  GH_TOKEN: ${{ github.token }}
              run: gh run download "$env:GITHUB_RUN_ID" --repo "$env:GITHUB_REPOSITORY" --name windows-x64 --dir dist
            - name: Install, run and uninstall
              shell: pwsh
              run: |
                  $msi = (Resolve-Path "dist\njmule-$env:VERSION-windows-x64.msi").Path
                  $log = "$env:RUNNER_TEMP\install.log"
                  $p = Start-Process msiexec.exe -ArgumentList @("/i", "`"$msi`"", "/qn", "/l*v", "`"$log`"") -PassThru -Wait
                  if ($p.ExitCode -ne 0) { throw "install failed: $($p.ExitCode)" }
                  # Per user, or for all users when the account is an administrator.
                  $dir = (Get-ItemProperty HKCU:\Software\njMule).InstallFolder
                  "Installed in $dir"
                  if (-not (Test-Path (Join-Path $dir "njmule.exe"))) {
                      Get-ChildItem $dir -ErrorAction SilentlyContinue | Format-Table Name, Length
                      Select-String -Path $log -Pattern "njmule.exe|INSTALLFOLDER|ProgramFiles" | Select-Object -First 40
                      throw "njmule.exe is not where the installer put the programs"
                  }
                  & (Join-Path $dir "njmule.exe") --version
                  # The update check tells an installed copy by this file.
                  if ((Get-Content (Join-Path $dir "install.properties") -Raw) -notmatch "kind=msi") { throw "install.properties does not say msi" }
                  $tour = "$env:RUNNER_TEMP\tour"
                  New-Item -ItemType Directory -Force "$tour\config" | Out-Null
                  Set-Content "$tour\config\njmule.properties" "net.ed2k.enabled=false`nnet.kad.enabled=false`nnet.upnp=false"
                  $gui = Start-Process (Join-Path $dir "njmule-gui.exe") -ArgumentList @("-Dnjmule.gui.tour=true", "--config-dir", $tour) -PassThru
                  if (-not $gui.WaitForExit(300000)) { $gui.Kill(); throw "the GUI tour did not finish" }
                  if (-not (Select-String -Quiet "Tour finished" "$tour\logs\*.log")) { throw "the GUI tour failed" }
                  # As if the desktop app had taken the ed2k links from another program: the
                  # uninstaller must give them back.
                  $command = "HKCU:\Software\Classes\ed2k\shell\open\command"
                  New-Item -Force $command | Out-Null
                  Set-Item $command -Value "`"$(Join-Path $dir "njmule-gui.exe")`" `"%1`""
                  $config = Join-Path $env:APPDATA "njMule\config"
                  New-Item -ItemType Directory -Force $config | Out-Null
                  Set-Content -Encoding Unicode (Join-Path $config "ed2k-handler-backup.reg") "Windows Registry Editor Version 5.00`r`n`r`n[HKEY_CURRENT_USER\Software\Classes\ed2k\shell\open\command]`r`n@=`"previous.exe %1`"`r`n"
                  $p = Start-Process msiexec.exe -ArgumentList @("/x", "`"$msi`"", "/qn") -PassThru -Wait
                  if ($p.ExitCode -ne 0) { throw "uninstall failed: $($p.ExitCode)" }
                  $key = Get-Item $command -ErrorAction SilentlyContinue
                  $after = if ($key) { $key.GetValue("") } else { "no ed2k key" }
                  if ($after -ne "previous.exe %1") { throw "the uninstaller did not give the ed2k links back: $after" }

    macos-arm64:
        name: macos-arm64
        needs: version
        runs-on: macos-latest
        env:
            VERSION: ${{ needs.version.outputs.version }}
            GRAALVM_SHA256: 4ec9932aa4aab1afca0ea31982d32d6f956615c61fe21a227b49756b25adda4f
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - name: Install GraalVM
              run: |
                  curl --proto =https --tlsv1.2 -sSfL -o "$RUNNER_TEMP/graalvm.tar.gz" "$GRAALVM_RELEASE/${GRAALVM_NAME}_macos-aarch64_bin.tar.gz"
                  echo "$GRAALVM_SHA256  $RUNNER_TEMP/graalvm.tar.gz" | shasum -a 256 -c -
                  mkdir -p "$RUNNER_TEMP/graalvm"
                  tar -C "$RUNNER_TEMP/graalvm" --strip-components=1 -xzf "$RUNNER_TEMP/graalvm.tar.gz"
                  echo "GRAALVM_HOME=$RUNNER_TEMP/graalvm/Contents/Home" >> "$GITHUB_ENV"
                  echo "JAVA_HOME=$RUNNER_TEMP/graalvm/Contents/Home" >> "$GITHUB_ENV"
            - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
              with:
                  cache-provider: basic
            # The committed metadata comes from Windows and Linux: the tour adds macOS's first. JavaFX's Metal pipeline
            # crashes now and then on the runner's virtual GPU, which has no OpenGL: the tour gets three tries.
            - name: Trace the GUI tour
              run: |
                  for attempt in 1 2 3; do
                      ./gradlew :njmule-gui:nativeTour && exit 0
                      echo "::warning::The GUI tour failed (attempt $attempt of 3)"
                  done
                  exit 1
            # Releases always get the full optimization, never the quick -Ob of the CI checks.
            - name: Build the native executable
              run: ./gradlew :njmule-gui:nativeGui '-Pnative.optimization=-O2'
            - name: Smoke test
              run: |
                  njmule-gui/build/native/njmule-gui --headless --version
                  tour="$RUNNER_TEMP/tour"
                  cp -r njmule-gui/native/tour "$tour"
                  # Drawn in software: the runner's virtual GPU crashes Metal now and then and has no OpenGL.
                  njmule-gui/build/native/njmule-gui -Dnjmule.gui.tour=true -Dprism.verbose=true -Dprism.order=sw \
                      --config-dir "$tour" > "$RUNNER_TEMP/gui.out" 2>&1 &
                  gui=$!
                  ( sleep 180 && kill -QUIT "$gui" && sleep 5 && kill "$gui" ) 2>/dev/null &
                  wait "$gui" || true
                  if ! grep -q "Tour finished" "$tour"/logs/*.log; then
                      cat "$RUNNER_TEMP/gui.out"
                      cat "$tour"/logs/*.log
                      exit 1
                  fi
            - name: Pack
              run: |
                  app=stage/njMule.app/Contents
                  mkdir -p "$app/MacOS" "$app/Resources" dist
                  cp -R njmule-gui/build/native/. "$app/MacOS/"
                  install -m 755 packaging/njmule.sh "$app/MacOS/njmule"
                  cp branding/generated/njmule.icns LICENSE NOTICE "$app/Resources/"
                  sed "s/@VERSION@/${VERSION%%-*}/g" packaging/macos/Info.plist > "$app/Info.plist"
                  printf 'kind=dmg\n' > "$app/Resources/install.properties"
                  plutil -lint "$app/Info.plist"
                  codesign --force --deep --sign - stage/njMule.app
                  codesign --verify --deep --strict stage/njMule.app
                  # The command line runs the desktop executable headless.
                  "$app/MacOS/njmule" --version
                  # Beside the app: moves it to the Trash, and the user's profile too when its box is ticked.
                  osacompile -o "stage/Uninstall njMule.app" packaging/macos/uninstall.applescript
                  codesign --force --deep --sign - "stage/Uninstall njMule.app"
                  ln -s /Applications stage/Applications
                  # LZMA (ULMO): smaller than zlib (UDZO), opened by every supported macOS.
                  hdiutil create -volname njMule -srcfolder stage -ov -format ULMO \
                      "dist/njmule-${VERSION}-macos-arm64.dmg"
            - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: macos-arm64
                  path: dist/

    # End to end, on a manual run: a build made for the test (version 0.0.0-e2e.0, trusting besides the
    # keys of njMule a key made for this run only) updates itself to the packages this run built, from a
    # release server on the loopback (tools/e2e-update-server.sh, reached through update.url). This job
    # writes and signs their update information with that key; the next ones install, update and check.
    e2e-sign:
        name: e2e update information
        if: github.event_name == 'workflow_dispatch'
        needs: [version, windows-x64, linux, macos-arm64]
        runs-on: ubuntu-24.04
        permissions:
            actions: read
            contents: read
        env:
            VERSION: ${{ needs.version.outputs.version }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
              with:
                  distribution: temurin
                  java-version: "25"
            - name: Collect the packages
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  gh run download "${GITHUB_RUN_ID}" --dir packages --name windows-x64 --name linux-x64 \
                      --name macos-arm64
                  mkdir -p dist
                  find packages -type f -exec cp {} dist/ \;
            - name: Sign the update information with a key of this run
              run: |
                  sudo apt-get update -qq
                  sudo apt-get install -y -qq --no-install-recommends minisign
                  minisign -G -W -p "$RUNNER_TEMP/e2e.pub" -s "$RUNNER_TEMP/e2e.key"
                  echo "The end-to-end test of the updates." > "$RUNNER_TEMP/notes.md"
                  mkdir -p e2e
                  java tools/UpdateManifest.java dist "${VERSION}" "$RUNNER_TEMP/notes.md" > e2e/njmule-update.json
                  minisign -S -s "$RUNNER_TEMP/e2e.key" -m e2e/njmule-update.json -t "njmule ${VERSION} e2e"
                  tail -n 1 "$RUNNER_TEMP/e2e.pub" > e2e/e2e.pub
            - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: e2e-update
                  path: e2e/

    # The MSI of the test build, installed for this user, updates to this run's MSI through the launcher
    # copied out of its folder and msiexec; the zip of the test build swaps its files for this run's zip.
    e2e-windows:
        name: e2e update (Windows MSI and zip)
        if: github.event_name == 'workflow_dispatch'
        needs: [version, e2e-sign]
        runs-on: windows-latest
        permissions:
            actions: read
            contents: read
        env:
            VERSION: ${{ needs.version.outputs.version }}
            GRAALVM_SHA256: 2733ea1331f1a98b05dd55a768b07347051dad48f030dbbfa191b11a2ccf4144
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
              with:
                  distribution: temurin
                  java-version: "25"
            - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
              with:
                  cache-provider: basic
            - name: Install GraalVM and WiX
              shell: pwsh
              run: |
                  Invoke-WebRequest "$env:GRAALVM_RELEASE/$($env:GRAALVM_NAME)_windows-x64_bin.zip" -OutFile "$env:RUNNER_TEMP\graalvm.zip"
                  if ((Get-FileHash "$env:RUNNER_TEMP\graalvm.zip" -Algorithm SHA256).Hash -ne $env:GRAALVM_SHA256) {
                      throw "GraalVM checksum mismatch"
                  }
                  tar -xf "$env:RUNNER_TEMP\graalvm.zip" -C $env:RUNNER_TEMP
                  "GRAALVM_HOME=$env:RUNNER_TEMP\graalvm-community-25.4.4.1.1+1.1" >> $env:GITHUB_ENV
                  dotnet tool install --global wix --version 5.0.2
            - name: Fetch the packages and their update information
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  gh run download "$env:GITHUB_RUN_ID" --repo "$env:GITHUB_REPOSITORY" --name windows-x64 --dir dist
                  gh run download "$env:GITHUB_RUN_ID" --repo "$env:GITHUB_REPOSITORY" --name e2e-update --dir e2e
            - name: Build the test version
              shell: bash
              run: |
                  cat e2e/e2e.pub >> njmule-core/src/main/resources/org/njmule/core/update/keys.pub
                  ./gradlew :njmule-gui:nativeGui :njmule-gui:nativeLauncher -Pversion=0.0.0-e2e.0 '-Pnative.optimization=-Ob'
            - name: Update the installed MSI and the unpacked zip
              shell: pwsh
              run: |
                  $settings = "net.ed2k.enabled=false`nnet.kad.enabled=false`nnet.upnp=false`nupdate.url=http://127.0.0.1:8765`nupdate.channel=PRERELEASE"
                  bash tools/e2e-update-server.sh dist e2e "$env:VERSION" "$env:RUNNER_TEMP/server"
                  if ($LASTEXITCODE -ne 0) { throw "no release server" }
                  # The installer: the test version for this user, then njmule --update.
                  $old = "$env:RUNNER_TEMP\old"
                  New-Item -ItemType Directory -Force $old | Out-Null
                  Copy-Item njmule-gui/build/native/*, njmule-gui/build/launcher/njmule-gui.exe $old
                  wix build packaging/windows/njmule.wxs -wx -arch x64 -pdbtype none -d "Version=0.0.0" -d "BinDir=$((Resolve-Path $old).Path)" -d "DocDir=$((Resolve-Path .).Path)" -d Gui=yes -o "$env:RUNNER_TEMP\old.msi"
                  $p = Start-Process msiexec.exe -ArgumentList @("/i", "`"$env:RUNNER_TEMP\old.msi`"", "/qn") -PassThru -Wait
                  if ($p.ExitCode -ne 0) { throw "the test version did not install: $($p.ExitCode)" }
                  $dir = (Get-ItemProperty HKCU:\Software\njMule).InstallFolder
                  $profile = "$env:RUNNER_TEMP\msi-profile"
                  New-Item -ItemType Directory -Force "$profile\config" | Out-Null
                  Set-Content "$profile\config\njmule.properties" $settings
                  & (Join-Path $dir "njmule.exe") --config-dir $profile --update
                  if ($LASTEXITCODE -ne 0) { throw "njmule --update failed: $LASTEXITCODE" }
                  # msiexec runs once that command has ended: the launcher writes its exit code.
                  $result = "$profile\cache\update\$env:VERSION\msiexec.txt"
                  $deadline = (Get-Date).AddMinutes(10)
                  while (-not (Test-Path $result) -and (Get-Date) -lt $deadline) { Start-Sleep 5 }
                  if (-not (Test-Path $result)) { throw "Windows Installer did not end" }
                  $code = (Get-Content $result -Raw).Trim()
                  if ($code -ne "0") {
                      Get-Content "$profile\cache\update\$env:VERSION\install.log" -ErrorAction SilentlyContinue | Select-Object -Last 60
                      throw "Windows Installer ended with $code"
                  }
                  $version = & (Join-Path $dir "njmule.exe") --version
                  "Installed: $version"
                  if ($version -notmatch [regex]::Escape("njMule $env:VERSION ")) { throw "the installed version is $version" }
                  # The zip: the test version unpacked, then njmule --update swaps its files.
                  $zip = "$env:RUNNER_TEMP\zip"
                  New-Item -ItemType Directory -Force $zip | Out-Null
                  Copy-Item njmule-gui/build/native/*, njmule-gui/build/launcher/njmule-gui.exe $zip
                  Set-Content -Encoding ascii "$zip\install.properties" "kind=zip"
                  $profile = "$env:RUNNER_TEMP\zip-profile"
                  New-Item -ItemType Directory -Force "$profile\config" | Out-Null
                  Set-Content "$profile\config\njmule.properties" $settings
                  & "$zip\njmule.exe" --config-dir $profile --update
                  if ($LASTEXITCODE -ne 0) { throw "njmule --update failed on the zip: $LASTEXITCODE" }
                  $version = & "$zip\njmule.exe" --version
                  "Unpacked: $version"
                  if ($version -notmatch [regex]::Escape("njMule $env:VERSION ")) { throw "the zip holds $version" }
                  if (-not (Test-Path "$zip\njmule.exe.old")) { throw "the old program was not kept" }
            - name: Stop Gradle
              if: always()
              run: ./gradlew --stop

    # The Linux archive of the test version swaps its files for this run's archive, in a container that has
    # nothing but a plain Debian.
    e2e-linux:
        name: e2e update (Linux tar in a container)
        if: github.event_name == 'workflow_dispatch'
        needs: [version, e2e-sign]
        runs-on: ubuntu-24.04
        permissions:
            actions: read
            contents: read
        env:
            VERSION: ${{ needs.version.outputs.version }}
            GRAALVM_SHA256: 05ccbbe783210b6886ff7b08fcd0b061c5dce4852b05db87284fc0e24abb08e2
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - name: Install GraalVM
              run: |
                  sudo apt-get update -qq
                  sudo apt-get install -y -qq --no-install-recommends build-essential zlib1g-dev
                  curl --proto =https --tlsv1.2 -sSfL -o "$RUNNER_TEMP/graalvm.tar.gz" \
                      "$GRAALVM_RELEASE/${GRAALVM_NAME}_linux-x64_bin.tar.gz"
                  echo "$GRAALVM_SHA256  $RUNNER_TEMP/graalvm.tar.gz" | sha256sum -c -
                  mkdir -p "$RUNNER_TEMP/graalvm"
                  tar -C "$RUNNER_TEMP/graalvm" --strip-components=1 -xzf "$RUNNER_TEMP/graalvm.tar.gz"
                  echo "GRAALVM_HOME=$RUNNER_TEMP/graalvm" >> "$GITHUB_ENV"
                  echo "JAVA_HOME=$RUNNER_TEMP/graalvm" >> "$GITHUB_ENV"
            - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
              with:
                  cache-provider: basic
            - name: Fetch the packages and their update information
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  gh run download "${GITHUB_RUN_ID}" --name linux-x64 --dir dist
                  gh run download "${GITHUB_RUN_ID}" --name e2e-update --dir e2e
            - name: Build the test version
              run: |
                  cat e2e/e2e.pub >> njmule-core/src/main/resources/org/njmule/core/update/keys.pub
                  ./gradlew :njmule-gui:nativeGui -Pversion=0.0.0-e2e.0 '-Pnative.optimization=-Ob'
            - name: Update the unpacked archive in a container
              run: |
                  test="$RUNNER_TEMP/test"
                  mkdir -p "$test/install" "$test/profile/config"
                  cp -r njmule-gui/build/native/. "$test/install/"
                  install -m 755 packaging/njmule.sh "$test/install/njmule"
                  printf 'kind=tar\n' > "$test/install/install.properties"
                  printf 'net.ed2k.enabled=false\nnet.kad.enabled=false\nnet.upnp=false\nupdate.url=http://127.0.0.1:8765\nupdate.channel=PRERELEASE\n' \
                      > "$test/profile/config/njmule.properties"
                  bash tools/e2e-update-server.sh dist e2e "${VERSION}" "$RUNNER_TEMP/server"
                  docker run --rm --network host -e LANG=C.UTF-8 -v "$test:/test" debian:stable-slim \
                      sh -c '/test/install/njmule --config-dir /test/profile --update && /test/install/njmule --version' \
                      | tee "$RUNNER_TEMP/update.out"
                  grep -q "njMule ${VERSION} " "$RUNNER_TEMP/update.out"
                  test -e "$test/install/njmule-gui.old"

    # The macOS app of the test version, in a folder of applications it may write to, swaps its bundle for
    # the one in this run's disk image.
    e2e-macos:
        name: e2e update (macOS app)
        if: github.event_name == 'workflow_dispatch'
        needs: [version, e2e-sign]
        runs-on: macos-latest
        permissions:
            actions: read
            contents: read
        env:
            VERSION: ${{ needs.version.outputs.version }}
            GRAALVM_SHA256: 4ec9932aa4aab1afca0ea31982d32d6f956615c61fe21a227b49756b25adda4f
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - name: Install GraalVM
              run: |
                  curl --proto =https --tlsv1.2 -sSfL -o "$RUNNER_TEMP/graalvm.tar.gz" "$GRAALVM_RELEASE/${GRAALVM_NAME}_macos-aarch64_bin.tar.gz"
                  echo "$GRAALVM_SHA256  $RUNNER_TEMP/graalvm.tar.gz" | shasum -a 256 -c -
                  mkdir -p "$RUNNER_TEMP/graalvm"
                  tar -C "$RUNNER_TEMP/graalvm" --strip-components=1 -xzf "$RUNNER_TEMP/graalvm.tar.gz"
                  echo "GRAALVM_HOME=$RUNNER_TEMP/graalvm/Contents/Home" >> "$GITHUB_ENV"
                  echo "JAVA_HOME=$RUNNER_TEMP/graalvm/Contents/Home" >> "$GITHUB_ENV"
            - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
              with:
                  cache-provider: basic
            - name: Fetch the packages and their update information
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  gh run download "${GITHUB_RUN_ID}" --name macos-arm64 --dir dist
                  gh run download "${GITHUB_RUN_ID}" --name e2e-update --dir e2e
            - name: Build the test version
              run: |
                  cat e2e/e2e.pub >> njmule-core/src/main/resources/org/njmule/core/update/keys.pub
                  ./gradlew :njmule-gui:nativeGui -Pversion=0.0.0-e2e.0 '-Pnative.optimization=-Ob'
            - name: Update the app bundle
              run: |
                  apps="$RUNNER_TEMP/Applications"
                  app="$apps/njMule.app/Contents"
                  mkdir -p "$app/MacOS" "$app/Resources" "$RUNNER_TEMP/profile/config"
                  cp -R njmule-gui/build/native/. "$app/MacOS/"
                  install -m 755 packaging/njmule.sh "$app/MacOS/njmule"
                  sed "s/@VERSION@/0.0.0/g" packaging/macos/Info.plist > "$app/Info.plist"
                  printf 'kind=dmg\n' > "$app/Resources/install.properties"
                  codesign --force --deep --sign - "$apps/njMule.app"
                  printf 'net.ed2k.enabled=false\nnet.kad.enabled=false\nnet.upnp=false\nupdate.url=http://127.0.0.1:8765\nupdate.channel=PRERELEASE\n' \
                      > "$RUNNER_TEMP/profile/config/njmule.properties"
                  bash tools/e2e-update-server.sh dist e2e "${VERSION}" "$RUNNER_TEMP/server"
                  "$app/MacOS/njmule" --config-dir "$RUNNER_TEMP/profile" --update
                  "$app/MacOS/njmule" --version | tee "$RUNNER_TEMP/update.out"
                  grep -q "njMule ${VERSION} " "$RUNNER_TEMP/update.out"
                  codesign --verify --deep --strict "$apps/njMule.app"
                  test -d "$apps/njMule.app.old"

    # For a tag, every package goes to VirusTotal (public API, key in the repository secret
    # VIRUSTOTAL_API_KEY), whose reports the draft release links. A failed scan only leaves them
    # out, never holds the release up. No write permission here, none of the release's secrets.
    virustotal:
        name: virustotal scan
        if: github.ref_type == 'tag'
        needs: [windows-x64, linux, macos-arm64, synology]
        runs-on: ubuntu-24.04
        permissions:
            actions: read
            contents: read
        outputs:
            scanned: ${{ steps.scan.outcome == 'success' }}
        steps:
            - name: Collect the packages
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  gh run download "${GITHUB_RUN_ID}" --repo "${GITHUB_REPOSITORY}" --dir packages \
                      --name windows-x64 --name linux-x64 --name linux-arm64 --name macos-arm64 --name synology-x86_64
                  mkdir -p dist
                  find packages -type f -exec cp {} dist/ \;
            # The public API takes 4 requests a minute. The action counts one per file, but one
            # over 32 MiB costs two (its upload URL, then the upload): one file a minute stays within.
            - id: scan
              name: Send the packages to VirusTotal
              uses: crazy-max/ghaction-virustotal@936d8c5c00afe97d3d9a1af26d017cfdf26800a2 # v5.0.0
              continue-on-error: true
              with:
                  vt_api_key: ${{ secrets.VIRUSTOTAL_API_KEY }}
                  request_rate: 1
                  files: dist/*
            - name: Report a failed scan
              if: steps.scan.outcome != 'success'
              run: echo "::warning::VirusTotal did not take every package; the draft release links no report"

    # The signing key of the update information is a secret of the environment "release", whose
    # required reviewer approves this job: nothing is signed without the maintainer.
    release:
        name: draft release
        if: github.ref_type == 'tag'
        needs: [version, windows-x64, windows-arm64, linux, macos-arm64, docker, synology, virustotal]
        runs-on: ubuntu-latest
        environment: release
        permissions:
            actions: read
            attestations: write
            contents: write
            id-token: write
        env:
            VERSION: ${{ needs.version.outputs.version }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
              with:
                  distribution: temurin
                  java-version: "25"
            - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
              with:
                  cache-provider: basic
            - name: Software bill of materials
              run: ./gradlew cyclonedxBom
            - name: Collect the packages
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  # The packages only: not the headless executables of the Docker image, nor build records.
                  gh run download "${GITHUB_RUN_ID}" --dir packages --name windows-x64 --name linux-x64 \
                      --name linux-arm64 --name macos-arm64 --name synology-x86_64
                  mkdir -p dist
                  find packages -type f -exec cp {} dist/ \;
                  # The ~ of a test version's deb and rpm names (dpkg and rpm read the version inside):
                  # GitHub may rename assets with such characters, and the update information names them.
                  for file in dist/*~*; do
                      if [[ -e "$file" ]]; then
                          mv "$file" "${file//\~/.}"
                      fi
                  done
                  cp build/reports/cyclonedx/bom.json "dist/njmule-${VERSION}-sbom.cdx.json"
                  awk -v v="${VERSION}" \
                      '$0 ~ "^## \\[" v "\\]" {on=1; next} on && /^## \[/ {exit} on' \
                      CHANGELOG.md > notes.md
                  java tools/UpdateManifest.java dist "${VERSION}" notes.md > dist/njmule-update.json
                  (cd dist && sha256sum -- * > SHA256SUMS)
            # In the release's notes only, after the update information took them: VirusTotal finds
            # a report by the file's SHA-256, the same as in SHA256SUMS.
            - name: Link the VirusTotal reports
              if: needs.virustotal.outputs.scanned == 'true'
              run: |
                  {
                      printf '\n### VirusTotal\n\nThe report of each package, found by its SHA-256:\n\n'
                      while read -r sha file; do
                          if [[ "$file" != *.json ]]; then
                              printf -- "- [\`%s\`](https://www.virustotal.com/gui/file/%s)\n" "$file" "$sha"
                          fi
                      done < dist/SHA256SUMS
                  } >> notes.md
                  cat notes.md
            # The update check of njMule takes the update information only signed by a key built into it.
            - name: Sign the update information and the checksums
              env:
                  MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
                  MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
              run: |
                  sudo apt-get update -qq
                  sudo apt-get install -y -qq --no-install-recommends minisign
                  key="$RUNNER_TEMP/njmule-update.key"
                  (umask 077 && printf '%s\n' "$MINISIGN_SECRET_KEY" > "$key")
                  for file in dist/njmule-update.json dist/SHA256SUMS; do
                      printf '%s\n' "$MINISIGN_PASSWORD" \
                          | minisign -S -s "$key" -m "$file" -t "njmule ${VERSION} $(basename "$file")"
                  done
                  rm -f "$key"
                  # Signed with one of the keys built into this version, before anything is published.
                  for file in dist/njmule-update.json dist/SHA256SUMS; do
                      ok=false
                      while read -r public; do
                          if minisign -V -q -P "$public" -m "$file"; then
                              ok=true
                              break
                          fi
                      done < <(grep -v -e '^#' -e '^untrusted comment' -e '^$' \
                          njmule-core/src/main/resources/org/njmule/core/update/keys.pub)
                      $ok || { echo "$file is not signed by a key of njMule" >&2; exit 1; }
                  done
            - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
              with:
                  subject-path: dist/*
            - name: Create the draft release
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  flags=(--draft --verify-tag --title "njMule ${GITHUB_REF_NAME}")
                  if [[ "${VERSION}" == *-* ]]; then
                      flags+=(--prerelease)
                  fi
                  gh release create "${GITHUB_REF_NAME}" "${flags[@]}" --notes-file notes.md dist/*
