name: Build

on:
    push:
        branches: [main]
    pull_request:

permissions:
    contents: read

jobs:
    # Changes that cannot affect the build (documents, repository metadata, branding sources, local
    # tools) skip the build jobs; skipped jobs count as passed, so such commits and PRs stay green.
    changes:
        name: detect changes
        runs-on: ubuntu-latest
        permissions:
            contents: read
            pull-requests: read
        outputs:
            build: ${{ steps.filter.outputs.build }}
            workflows: ${{ steps.filter.outputs.workflows }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
              id: filter
              with:
                  predicate-quantifier: every
                  filters: |
                      build:
                          - '**'
                          - '!**/*.md'
                          - '!.github/ISSUE_TEMPLATE/**'
                          - '!.github/CODEOWNERS'
                          - '!.github/dependabot.yml'
                          - '!.githooks/**'
                          - '!.editorconfig'
                          - '!.gitignore'
                          - '!AUTHORS'
                          - '!LICENSES/**'
                          - '!REUSE.toml'
                          - '!branding/*'
                          - '!branding/generated/njmule-avatar-512.png'
                          - '!branding/generated/njmule-social-preview.png'
                          - '!tools/**'
                      workflows:
                          - '.github/workflows/**'

    verify:
        name: verify (${{ matrix.os }})
        needs: changes
        if: needs.changes.outputs.build == 'true'
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, windows-latest]
        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
              with:
                  distribution: temurin
                  java-version: "25"
            # Gradle User Home cache through actions/cache (the open-source provider); also checks the
            # wrapper jar against the published checksums.
            - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
              with:
                  cache-provider: basic
            # One module's tests at a time: on the runners' four CPUs the long timed tests (the Kad
            # simulation, the window tests) ran out of time next to the other modules' test JVMs.
            - name: Build and test
              shell: bash
              run: ./gradlew build '-Ptest.parallelModules=1'
            - name: Upload test reports
              if: failure()
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: test-reports-${{ matrix.os }}
                  path: |
                      **/build/test-results/
                      **/build/reports/tests/
            # The basic cache provider saves Gradle's user home without stopping the daemon, whose lock
            # files Windows does not let it read.
            - name: Stop Gradle
              if: always() && runner.os == 'Windows'
              shell: bash
              run: ./gradlew --stop

    actionlint:
        name: actionlint
        needs: changes
        if: needs.changes.outputs.workflows == 'true'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            # Official image (actionlint with shellcheck), pinned by digest.
            - name: Lint the workflows
              uses: docker://rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
              with:
                  args: -color

    reuse:
        name: REUSE compliance
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5 # v6.0.0

    native:
        name: native image (linux-x64)
        needs: changes
        if: needs.changes.outputs.build == 'true'
        runs-on: ubuntu-latest
        # Same pinned GraalVM Community image as the local Docker build (CLAUDE.md).
        container: ghcr.io/graalvm/native-image-community:25i4-25.0.4.1.1
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            # Gradle User Home cache through actions/cache (the open-source provider); also checks the
            # wrapper jar against the published checksums.
            - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
              with:
                  cache-provider: basic
            - name: Build the native executable
              run: ./gradlew :njmule-app:nativeCompile '-Pnative.optimization=-Ob'
            - name: Smoke test
              run: |
                  njmule-app/build/native/nativeCompile/njmule --version
                  njmule-app/build/native/nativeCompile/njmule --license | grep -q "GNU GENERAL PUBLIC LICENSE"
            - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: njmule-linux-x64
                  path: njmule-app/build/native/nativeCompile/njmule

    native-windows:
        name: native image (windows-x64)
        needs: changes
        if: needs.changes.outputs.build == 'true'
        runs-on: windows-latest
        # The same GraalVM Community release as the Linux image; native-image finds the runner's
        # Visual Studio on its own.
        env:
            GRAALVM_URL: https://github.com/graalvm/graalvm-ce-builds/releases/download/graal-25.4.4.1.1/graalvm-community-jdk-25i4-25.0.4.1.1_windows-x64_bin.zip
            GRAALVM_SHA256: 2733ea1331f1a98b05dd55a768b07347051dad48f030dbbfa191b11a2ccf4144
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
              with:
                  distribution: temurin
                  java-version: "25"
            # Gradle User Home cache through actions/cache (the open-source provider); also checks the
            # wrapper jar against the published checksums.
            - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
              with:
                  cache-provider: basic
            - name: Install GraalVM
              shell: pwsh
              run: |
                  Invoke-WebRequest $env:GRAALVM_URL -OutFile "$env:RUNNER_TEMP\graalvm.zip"
                  if ((Get-FileHash "$env:RUNNER_TEMP\graalvm.zip" -Algorithm SHA256).Hash -ne $env:GRAALVM_SHA256) {
                      throw "GraalVM checksum mismatch"
                  }
                  tar -xf "$env:RUNNER_TEMP\graalvm.zip" -C $env:RUNNER_TEMP
                  "GRAALVM_HOME=$env:RUNNER_TEMP\graalvm-community-25.4.4.1.1+1.1" >> $env:GITHUB_ENV
            - name: Build the native executable
              run: ./gradlew :njmule-app:nativeCompile '-Pnative.optimization=-Ob'
            - name: Smoke test
              shell: pwsh
              run: |
                  njmule-app/build/native/nativeCompile/njmule.exe --version
                  if (-not ((njmule-app/build/native/nativeCompile/njmule.exe --license) -match "GNU GENERAL PUBLIC LICENSE")) {
                      throw "license text missing"
                  }
            - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: njmule-windows-x64
                  path: njmule-app/build/native/nativeCompile/njmule.exe
            # The basic cache provider saves Gradle's user home without stopping the daemon, whose lock
            # files Windows does not let it read.
            - name: Stop Gradle
              if: always()
              run: ./gradlew --stop

    sonar:
        name: SonarQube Cloud
        needs: changes
        if: needs.changes.outputs.build == 'true'
        runs-on: ubuntu-latest
        # Skipped until the SONAR_TOKEN secret exists (and on forks, which do not receive it).
        env:
            SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              if: env.SONAR_TOKEN != ''
              with:
                  fetch-depth: 0
            - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
              if: env.SONAR_TOKEN != ''
              with:
                  distribution: temurin
                  java-version: "25"
            - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
              if: env.SONAR_TOKEN != ''
              with:
                  cache-provider: basic
            - name: Build and analyse
              if: env.SONAR_TOKEN != ''
              run: ./gradlew build sonar '-Ptest.parallelModules=1'

    # The one check to require on pull requests: it passes when every job passed or was skipped
    # because the change does not need a build.
    ci:
        name: CI result
        if: always()
        needs: [changes, verify, actionlint, reuse, native, native-windows, sonar]
        runs-on: ubuntu-latest
        steps:
            - uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
              with:
                  allowed-skips: verify, actionlint, native, native-windows, sonar
                  jobs: ${{ toJSON(needs) }}
