name: Build

on:
    push:
        branches: [main]
    pull_request:

permissions:
    contents: read

jobs:
    verify:
        name: verify (${{ matrix.os }})
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, windows-latest]
        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-java@v5
              with:
                  distribution: temurin
                  java-version: "25"
                  cache: maven
            - name: Build and test
              shell: bash
              run: ./mvnw -B -ntp verify
            - name: Upload test reports
              if: failure()
              uses: actions/upload-artifact@v4
              with:
                  name: test-reports-${{ matrix.os }}
                  path: "**/target/surefire-reports/"

    reuse:
        name: REUSE compliance
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: fsfe/reuse-action@v5

    native:
        name: native image (linux-x64)
        runs-on: ubuntu-latest
        # Same pinned GraalVM Community image as the local Docker build (CLAUDE.md).
        container: ghcr.io/graalvm/native-image-community:25i4-25.0.4.1.1
        steps:
            - uses: actions/checkout@v7
            - name: Build the native executable
              run: ./mvnw -B -ntp -Pnative -pl njmule-app -am package -DskipTests
            - name: Smoke test
              run: |
                  njmule-app/target/njmule --version
                  njmule-app/target/njmule --license | grep -q "GNU GENERAL PUBLIC LICENSE"
            - uses: actions/upload-artifact@v4
              with:
                  name: njmule-linux-x64
                  path: njmule-app/target/njmule
