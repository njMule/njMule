name: Build

on:
    push:
        branches: [main]
    pull_request:
    # Once a week everything, the Synology package included: what changes outside the repository (runner images,
    # downloads, toolchains) breaks there first.
    schedule:
        - cron: "23 4 * * 1"

permissions:
    contents: read

# A newer commit of the same pull request or branch makes the older run useless, and frees its runners.
concurrency:
    group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    # Changes that cannot affect a job skip it; skipped jobs count as passed, so documentation or metadata
    # pull requests stay green. The weekly run takes no filter and builds everything.
    changes:
        name: detect changes
        runs-on: ubuntu-latest
        permissions:
            contents: read
            pull-requests: read
        outputs:
            ui: ${{ github.event_name == 'schedule' || steps.filter.outputs.ui == 'true' }}
            desktop: ${{ github.event_name == 'schedule' || steps.filter.outputs.desktop == 'true' }}
            engine: ${{ github.event_name == 'schedule' || steps.filter.outputs.engine == 'true' }}
            windows: ${{ github.event_name == 'schedule' || steps.filter.outputs.windows == 'true' }}
            macos: ${{ github.event_name == 'schedule' || steps.filter.outputs.macos == 'true' }}
            synology: ${{ github.event_name == 'schedule' || steps.filter.outputs.synology == 'true' }}
            workflows: ${{ steps.filter.outputs.workflows == 'true' }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
              if: github.event_name != 'schedule'
              id: filter
              with:
                  filters: |
                      ui:
                          - 'njmule-ui/**'
                          - 'njmule-engine/assets/openapi.yaml'
                          - 'gradle/**'
                          - 'gradle.properties'
                          - 'settings.gradle.kts'
                          - 'build.gradle.kts'
                          - '*.lockfile'
                          - '.github/workflows/build.yml'
                      desktop:
                          - 'njmule-desktop/**'
                          - 'njmule-ui/**'
                          - 'njmule-engine/assets/openapi.yaml'
                          - 'branding/generated/**'
                          - 'gradle/**'
                          - 'gradle.properties'
                          - 'settings.gradle.kts'
                          - 'build.gradle.kts'
                          - '*.lockfile'
                          - '.github/workflows/build.yml'
                      engine:
                          - 'njmule-engine/**'
                          - 'branding/njmule-icon.svg'
                          - 'branding/generated/njmule-32.png'
                          - 'gradle.properties'
                          - '.github/workflows/build.yml'
                      windows:
                          - 'njmule-engine/**'
                          - 'njmule-ui/**'
                          - 'packaging/windows/**'
                          - 'branding/njmule-icon.svg'
                          - 'branding/generated/**'
                          - 'gradle/**'
                          - 'gradle.properties'
                          - 'settings.gradle.kts'
                          - 'build.gradle.kts'
                          - '*.lockfile'
                          - '.github/scripts/windows-service-test.ps1'
                          - '.github/workflows/build.yml'
                      macos:
                          - 'njmule-engine/**'
                          - 'njmule-ui/**'
                          - 'branding/njmule-icon.svg'
                          - 'branding/generated/njmule-32.png'
                          - 'gradle/**'
                          - 'gradle.properties'
                          - 'settings.gradle.kts'
                          - 'build.gradle.kts'
                          - '*.lockfile'
                          - '.github/workflows/build.yml'
                      synology:
                          - 'njmule-engine/**'
                          - 'njmule-ui/**'
                          - 'packaging/synology/**'
                          - 'branding/njmule-icon.svg'
                          - 'branding/generated/**'
                          - 'gradle/**'
                          - 'gradle.properties'
                          - 'settings.gradle.kts'
                          - 'build.gradle.kts'
                          - '*.lockfile'
                          - '.github/workflows/build.yml'
                      workflows:
                          - '.github/workflows/**'

    # The Vue user interface (type-check, Vite bundle, Vitest, Prettier) and Gradle's root tools.
    ui:
        name: interface (ui)
        needs: changes
        if: needs.changes.outputs.ui == 'true'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
              with:
                  distribution: temurin
                  java-version: "25"
                  cache-jdk: true
            - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
              with:
                  cache-provider: basic
            - name: Build, lint and test the interface
              run: ./gradlew :njmule-ui:build :iconTools

    # The desktop window's shell, in Rust, on each system it is packaged for: formatted, linted and tested, with the
    # toolchain src-tauri/rust-toolchain.toml pins and the interface it embeds built first.
    desktop:
        name: desktop shell (${{ matrix.os }})
        needs: changes
        if: needs.changes.outputs.desktop == 'true'
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, windows-latest, macos-latest]
        runs-on: ${{ matrix.os }}
        defaults:
            run:
                shell: bash
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
              with:
                  distribution: temurin
                  java-version: "25"
                  cache-jdk: true
                  cache-read-only: true
            - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
              with:
                  cache-provider: basic
                  cache-read-only: true
            - name: Install the web view's libraries
              if: runner.os == 'Linux'
              run: |
                  sudo apt-get update -qq
                  sudo apt-get install -y -qq --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev \
                      librsvg2-dev libayatana-appindicator3-dev libxdo-dev
            - name: Install the pinned Rust
              working-directory: njmule-desktop/src-tauri
              run: |
                  channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
                  rustup toolchain install "$channel" --profile minimal --component rustfmt,clippy
            - name: Build the interface it embeds
              run: ./gradlew :njmule-ui:site
            - name: Format, lint and test
              working-directory: njmule-desktop/src-tauri
              run: |
                  cargo fmt --check
                  cargo clippy --locked --release --all-targets -- -D warnings
                  cargo test --locked --release
            # The basic cache provider saves Gradle's user home without stopping the daemon, whose lock
            # files Windows does not let it read.
            - name: Stop Gradle
              if: always() && runner.os == 'Windows'
              run: ./gradlew --stop

    # The Rust engine: formatted, linted, unit + integration + end-to-end tests with coverage, crate policy,
    # third-party notices and SBOM.
    engine:
        name: rust engine
        needs: changes
        if: needs.changes.outputs.engine == 'true'
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: njmule-engine
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - name: Install the pinned Rust
              run: |
                  channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
                  rustup toolchain install "$channel" --profile minimal --component rustfmt,clippy,llvm-tools
            - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
              with:
                  tool: cargo-llvm-cov@0.9.1, cargo-about@0.9.3, cargo-cyclonedx@0.5.10
            - name: Format, lint and test
              run: |
                  cargo fmt --check
                  cargo clippy --locked --all-targets -- -D warnings
                  cargo llvm-cov --locked --fail-under-lines 70
            - name: Licenses, advisories and sources of the crates
              uses: EmbarkStudios/cargo-deny-action@17aeb3c839e42274e2b8adf721c8c65edfdc74dd # v2.1.3
              with:
                  manifest-path: njmule-engine/Cargo.toml
            - name: Third-party notices and SBOM
              run: |
                  cargo about generate about.hbs -o target/THIRD-PARTY.txt
                  cargo cyclonedx --format json --spec-version 1.6 --describe binaries --no-build-deps --target all
                  rm -f njmule_bin.cdx.json

    # The Windows executable and service host, tested with the real Windows service on the runner.
    windows:
        name: engine (windows-x64)
        needs: changes
        if: needs.changes.outputs.windows == 'true'
        runs-on: windows-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
              with:
                  distribution: temurin
                  java-version: "25"
                  cache-jdk: true
            - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
              with:
                  cache-provider: basic
            - name: Install the pinned Rust
              shell: bash
              working-directory: njmule-engine
              run: |
                  channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
                  rustup toolchain install "$channel" --profile minimal
                  rustup default "$channel"
            - name: Build the interface, the engine and the service
              shell: bash
              run: |
                  ./gradlew :njmule-ui:compress :nativeService
                  cargo build --manifest-path njmule-engine/Cargo.toml --locked --release --bin njmule
            - name: Smoke test
              shell: pwsh
              run: |
                  njmule-engine/target/release/njmule.exe --version
                  if (-not ((njmule-engine/target/release/njmule.exe --license) -match "GNU GENERAL PUBLIC LICENSE")) {
                      throw "license text missing"
                  }
            # The runner is an administrator: the real service, as the release checks it before packing, so that a
            # pull request that breaks it fails here rather than on a tag.
            - name: Service test
              shell: pwsh
              run: |
                  Copy-Item build/windows/njmule-service.exe njmule-engine/target/release/
                  ./.github/scripts/windows-service-test.ps1 njmule-engine/target/release/njmule.exe
            # The basic cache provider saves Gradle's user home without stopping the daemon, whose lock
            # files Windows does not let it read.
            - name: Stop Gradle
              if: always()
              shell: bash
              run: ./gradlew --stop

    # macOS is built and smoke-tested here too: the release would otherwise be the first to try it.
    macos:
        name: engine (macos-arm64)
        needs: changes
        if: needs.changes.outputs.macos == 'true'
        runs-on: macos-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
              with:
                  distribution: temurin
                  java-version: "25"
                  cache-jdk: true
            - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
              with:
                  cache-provider: basic
            - name: Install the pinned Rust
              working-directory: njmule-engine
              run: |
                  channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
                  rustup toolchain install "$channel" --profile minimal
                  rustup default "$channel"
            - name: Build the interface and the engine
              run: |
                  ./gradlew :njmule-ui:compress
                  cargo build --manifest-path njmule-engine/Cargo.toml --locked --release --bin njmule
            - name: Smoke test
              run: |
                  njmule-engine/target/release/njmule --version
                  njmule-engine/target/release/njmule --license | grep -q "GNU GENERAL PUBLIC LICENSE"

    # The static executable of the Synology package, linked with musl, and the package around it.
    synology:
        name: synology package (x86_64)
        needs: changes
        if: needs.changes.outputs.synology == 'true'
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
              with:
                  distribution: temurin
                  java-version: "25"
                  cache-jdk: true
                  cache-read-only: true
            - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
              with:
                  cache-provider: basic
                  cache-read-only: true
            - name: Install musl tools and the pinned Rust
              working-directory: njmule-engine
              run: |
                  sudo apt-get update -qq
                  sudo apt-get install -y -qq --no-install-recommends musl-tools
                  channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
                  rustup toolchain install "$channel" --profile minimal --target x86_64-unknown-linux-musl
                  rustup default "$channel"
            - name: Build the interface and the static executable
              run: |
                  ./gradlew :njmule-ui:compress
                  CC_x86_64_unknown_linux_musl=musl-gcc cargo build --manifest-path njmule-engine/Cargo.toml \
                      --locked --release --target x86_64-unknown-linux-musl --bin njmule
            # Static, or it would not start on DSM's old glibc.
            - name: Smoke test
              run: |
                  exe=njmule-engine/target/x86_64-unknown-linux-musl/release/njmule
                  if ldd "$exe" 2>&1 | grep -q '=>'; then
                      echo "njmule links to libraries of the system" >&2
                      ldd "$exe" >&2
                      exit 1
                  fi
                  "$exe" --version
                  "$exe" --license | grep -q "GNU GENERAL PUBLIC LICENSE"
            - name: Pack and check the package
              run: |
                  mkdir -p build/synology
                  SPK_BUILD=1 packaging/synology/build-spk.sh \
                      njmule-engine/target/x86_64-unknown-linux-musl/release/njmule x86_64 build/synology
                  spk=$(ls build/synology/*.spk)
                  tar -tf "$spk" > "$RUNNER_TEMP/spk.txt"
                  for entry in INFO package.tgz scripts/start-stop-status conf/privilege LICENSE PACKAGE_ICON.PNG; do
                      grep -qx "$entry" "$RUNNER_TEMP/spk.txt" || { echo "$entry missing from the package" >&2; exit 1; }
                  done
                  tar -xOf "$spk" INFO | grep -qx 'arch="x86_64"'
                  tar -xOf "$spk" package.tgz | tar -tJf - | grep -qx 'bin/njmule'

    actionlint:
        name: actionlint
        needs: changes
        if: needs.changes.outputs.workflows == 'true'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            # Official image (actionlint with shellcheck), pinned by digest.
            - name: Lint the workflows
              uses: docker://rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
              with:
                  args: -color

    reuse:
        name: REUSE compliance
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5 # v6.0.0

    # The one check to require on pull requests: it passes when every job passed or was skipped
    # because the change does not need a build.
    ci:
        name: CI result
        if: always()
        needs: [changes, ui, desktop, engine, windows, macos, synology, actionlint, reuse]
        runs-on: ubuntu-latest
        steps:
            - uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
              with:
                  allowed-skips: ui, desktop, engine, windows, macos, synology, actionlint
                  jobs: ${{ toJSON(needs) }}
