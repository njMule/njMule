name: Feature request
description: Suggest an improvement
labels: ["enhancement"]
body:
    - type: textarea
      id: problem
      attributes:
          label: Problem
          description: What are you trying to do? How does eMule handle it, if relevant?
      validations:
          required: true
    - type: textarea
      id: proposal
      attributes:
          label: Proposed solution
