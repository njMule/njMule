version: 2
updates:
    - package-ecosystem: gradle
      directory: /
      schedule:
          interval: weekly
      commit-message:
          prefix: "chore(deps)"
    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: weekly
      commit-message:
          prefix: "ci(deps)"
    # The base images of the Docker image, pinned by digest.
    - package-ecosystem: docker
      directory: /packaging/docker
      schedule:
          interval: weekly
      commit-message:
          prefix: "build(deps)"
    # The documentation website's packages (website/package-lock.json); Docusaurus' packages move together.
    - package-ecosystem: npm
      directory: /website
      schedule:
          interval: weekly
      commit-message:
          prefix: "docs(deps)"
      groups:
          docusaurus:
              patterns:
                  - "@docusaurus/*"
          openapi-docs:
              patterns:
                  - "docusaurus-plugin-openapi-docs"
                  - "docusaurus-theme-openapi-docs"
    # The interface of the desktop window and the web interface (njmule-ui/package-lock.json).
    - package-ecosystem: npm
      directory: /njmule-ui
      schedule:
          interval: weekly
      commit-message:
          prefix: "chore(deps)"
      groups:
          vue:
              patterns:
                  - "vue"
                  - "vue-tsc"
                  - "@vue/*"
                  - "@vitejs/plugin-vue"
          tanstack:
              patterns:
                  - "@tanstack/*"
          vitest:
              patterns:
                  - "vite"
                  - "vitest"
    # The desktop window's Tauri command line, then its Rust crates, the Tauri crate and its plugins together.
    - package-ecosystem: npm
      directory: /njmule-desktop
      schedule:
          interval: weekly
      commit-message:
          prefix: "chore(deps)"
    - package-ecosystem: cargo
      directory: /njmule-desktop/src-tauri
      schedule:
          interval: weekly
      commit-message:
          prefix: "chore(deps)"
      groups:
          tauri:
              patterns:
                  - "tauri"
                  - "tauri-*"
