version: 2
updates:
    - package-ecosystem: maven
      directory: /
      schedule:
          interval: weekly
      commit-message:
          prefix: "chore(deps)"
    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: weekly
      commit-message:
          prefix: "ci(deps)"
