version: 2
updates:
    - package-ecosystem: gradle
      directory: /
      schedule:
          interval: weekly
      commit-message:
          prefix: "chore(deps)"
    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: weekly
      commit-message:
          prefix: "ci(deps)"
    # The base images of the Docker image, pinned by digest.
    - package-ecosystem: docker
      directory: /packaging/docker
      schedule:
          interval: weekly
      commit-message:
          prefix: "build(deps)"
    # The documentation website's packages (website/package-lock.json); Docusaurus' packages move together.
    - package-ecosystem: npm
      directory: /website
      schedule:
          interval: weekly
      commit-message:
          prefix: "docs(deps)"
      groups:
          docusaurus:
              patterns:
                  - "@docusaurus/*"
          openapi-docs:
              patterns:
                  - "docusaurus-plugin-openapi-docs"
                  - "docusaurus-theme-openapi-docs"
