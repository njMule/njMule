version: 2
updates:
    - package-ecosystem: gradle
      directory: /
      schedule:
          interval: weekly
      commit-message:
          prefix: "chore(deps)"
    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: weekly
      commit-message:
          prefix: "ci(deps)"
    # The base images of the Docker image, pinned by digest.
    - package-ecosystem: docker
      directory: /packaging/docker
      schedule:
          interval: weekly
      commit-message:
          prefix: "build(deps)"
