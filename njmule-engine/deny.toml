# cargo deny check: the crates the engine takes must be GPL-3.0-compatible, free of known
# advisories and from crates.io.

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "GPL-3.0-or-later",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9
# The list is for the crates to come: one no crate takes yet is no mistake.
unused-allowed-license = "allow"

[advisories]
yanked = "deny"
ignore = [
    # The Marvin attack: the timing of RSA private-key operations may leak the key. Secure identification signs
    # with blinding, and its 384-bit keys, which the protocol fixes, can be factored offline anyway: the timing
    # leaks nothing a peer could not get otherwise. To drop once rsa 0.10 is stable.
    { id = "RUSTSEC-2023-0071", reason = "secure identification's 384-bit keys give no secrecy to protect; signing is blinded" },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
