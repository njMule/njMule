[package]
name = "njmule-engine"
version = "0.0.0"
description = "njMule's engine in Rust, ported from the Java engine and checked against its corpora"
license = "GPL-3.0-or-later"
edition = "2024"
rust-version = "1.99"
publish = false

[[bin]]
name = "njmule"
path = "src/main.rs"

[dependencies]
axum = "0.8.9"
clap = { version = "4.6.7", features = ["derive"] }
data-encoding = "2.11.1"
dirs = "7.0.0"
encoding_rs = "0.8.44"
fancy-regex = "0.20.0"
flate2 = "1.1.10"
futures-util = "0.3.34"
http = "1.5.0"
indexmap = "2.14.2"
java-properties = "2.0.0"
md-5 = "0.11.0"
md4 = "0.11.0"
miniz_oxide = "0.9.1"
num-bigint = "0.5.1"
num-bigint-dig = "0.8.6"
num-integer = "0.1.47"
percent-encoding = "2.3.2"
rangemap = "1.8.0"
rand = "0.10.3"
rc4 = "0.2.0"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "socks"] }
rsa = { version = "0.9.10", features = ["getrandom"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sha1 = "0.11.0"
strsim = "0.11.1"
strum = { version = "0.28.0", features = ["derive"] }
subtle = "2.6.1"
sysinfo = { version = "0.40.1", default-features = false, features = ["system"] }
time = "0.3.55"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "io-util", "io-std", "sync", "time", "fs", "signal"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = "0.3.23"
zip = { version = "9.4.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }
unicode-general-category = "1.1.0"
url = "2.5.8"

[dev-dependencies]
hex = "0.4"
proptest = "1.12.0"
tempfile = "3.27.0"

[lints.rust]
unsafe_code = "forbid"

# What network input must never do: panic on an index, an unwrap or an overflow.
[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"

[profile.release]
# Silent wrapping in release builds is a bug class Java does not have: checked through the betas.
overflow-checks = true
