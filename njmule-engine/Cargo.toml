[package]
name = "njmule-engine"
version = "0.0.0"
description = "njMule's engine in Rust, ported from the Java engine and checked against its corpora"
license = "GPL-3.0-or-later"
edition = "2024"
rust-version = "1.99"
publish = false
# The tests of `tests/` are the modules of one executable, `tests/main.rs`.
autotests = false

[[bin]]
name = "njmule"
path = "src/main.rs"

[[test]]
name = "suite"
path = "tests/main.rs"

[dependencies]
axum = "0.8.9"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
clap = { version = "4.6.7", features = ["derive"] }
cookie = "0.18.2"
data-encoding = "2.11.1"
dirs = "7.0.0"
dunce = "1.0.5"
encoding_rs = "0.8.44"
fancy-regex = "0.20.0"
flate2 = "1.1.10"
form_urlencoded = "1.2.2"
fs4 = "1.1.0"
futures-util = "0.3.34"
http = "1.5.0"
if-addrs = "0.15.0"
indexmap = "2.14.2"
ipnet = "2.12.2"
java-properties = "2.0.0"
lettre = { version = "0.11.23", default-features = false, features = ["smtp-transport", "builder", "tokio1-rustls", "ring", "rustls-platform-verifier"] }
jsonschema = { version = "0.60.2", default-features = false }
md-5 = "0.11.0"
md4 = "0.11.0"
miniz_oxide = "0.9.1"
netdev = { version = "0.47.0", default-features = false, features = ["gateway"] }
notify = "8.2.1"
num-bigint = "0.5.1"
num-bigint-dig = "0.8.6"
num-integer = "0.1.47"
percent-encoding = "2.3.2"
pbkdf2 = { version = "0.13.0", default-features = false, features = ["hmac"] }
quinn = { version = "0.11.12", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rangemap = "1.8.0"
rand = "0.10.3"
rc4 = "0.2.0"
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "ring"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "socks"] }
roxmltree = "0.21.2"
rsa = { version = "0.9.10", features = ["getrandom"] }
rust-embed = { version = "8.13.0", default-features = false }
same-file = "1.0.6"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-platform-verifier = "0.7.1"
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sha1 = "0.11.0"
socket2 = "0.6.5"
strsim = "0.11.1"
strum = { version = "0.28.0", features = ["derive"] }
subtle = "2.6.1"
sysinfo = { version = "0.40.1", default-features = false, features = ["system"] }
time = "0.3.55"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "io-util", "io-std", "sync", "time", "fs", "signal", "process"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["tls12"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
tower = { version = "0.5.3", default-features = false, features = ["util"] }
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = "0.3.23"
zip = { version = "9.4.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }
unicode-general-category = "1.1.0"
url = "2.5.8"
walkdir = "2.5.0"
yaml-rust2 = { version = "0.13.0", default-features = false }

[dev-dependencies]
hex = "0.4"
proptest = "1.12.0"
tempfile = "3.27.0"
x509-parser = { version = "0.18.1", features = ["verify"] }

[lints.rust]
unsafe_code = "forbid"

# What network input must never do: panic on an index, an unwrap or an overflow.
[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"

# Each test file links its own executable: full debug info made a PDB of about 200 MB for each one. Line tables keep
# the file and line of a backtrace.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
# Silent wrapping in release builds is a bug class Java does not have: checked through the betas.
overflow-checks = true
