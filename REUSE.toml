# SPDX-FileCopyrightText: 2026 Salvatore Coppola and the njMule contributors
# SPDX-License-Identifier: GPL-3.0-or-later
#
# REUSE (https://reuse.software) metadata for files that cannot carry an SPDX header.
# Check with: reuse lint
version = 1

[[annotations]]
path = [
    "NOTICE",
    "*.lockfile",
    "**/*.lockfile",
    "**/META-INF/services/**",
    "**/META-INF/native-image/**",
    "**/src/test/resources/**",
    "branding/**",
    ".github/assets/**",
    "packaging/**/*.png",
    "packaging/**/*.ico",
    "packaging/**/*.icns",
    "packaging/synology/conf/*",
    "packaging/synology/WIZARD_UIFILES/*",
    "packaging/synology/app/*",
    "njmule-gui/native/*.args",
    "njmule-gui/native/**/*.json",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Salvatore Coppola and the njMule contributors"
SPDX-License-Identifier = "GPL-3.0-or-later"

# Gradle Wrapper, generated by Gradle's wrapper task.
[[annotations]]
path = ["gradlew", "gradlew.bat", "gradle/wrapper/gradle-wrapper.jar", "gradle/wrapper/gradle-wrapper.properties"]
precedence = "override"
SPDX-FileCopyrightText = "Gradle Inc."
SPDX-License-Identifier = "Apache-2.0"

# Manrope, the face of titles and of the wordmark: its static Bold and ExtraBold, downloaded unchanged on
# 17 October 2026 from https://github.com/googlefonts/manrope at commit 468c0dbe38efa331b80bfe9448256abe27be44c3.
[[annotations]]
path = ["njmule-gui/src/main/resources/org/njmule/gui/fonts/*.ttf"]
precedence = "override"
SPDX-FileCopyrightText = "2018 The Manrope Project Authors (https://github.com/googlefonts/manrope)"
SPDX-License-Identifier = "OFL-1.1"

# The server list and Kad contacts a new profile starts from, downloaded unchanged on 15 October
# 2026 from https://upd.emule-security.org/server.met and /nodes.dat: public addresses, ports and
# server names, facts not covered by copyright.
[[annotations]]
path = [
    "njmule-core/src/main/resources/org/njmule/core/engine/server.met",
    "njmule-core/src/main/resources/org/njmule/core/engine/nodes.dat",
]
precedence = "override"
SPDX-FileCopyrightText = "NONE"
SPDX-License-Identifier = "CC0-1.0"

# The license texts of musl and zlib, linked statically into the Synology DSM executable and shipped
# with its package: musl 1.2.5's COPYRIGHT unchanged, and the notice at the head of zlib 1.2.13's zlib.h.
[[annotations]]
path = "packaging/synology/licenses/musl-COPYRIGHT"
precedence = "override"
SPDX-FileCopyrightText = "2005-2020 Rich Felker, et al."
SPDX-License-Identifier = "MIT"

[[annotations]]
path = "packaging/synology/licenses/zlib-LICENSE"
precedence = "override"
SPDX-FileCopyrightText = "1995-2022 Jean-loup Gailly and Mark Adler"
SPDX-License-Identifier = "Zlib"
