# SPDX-License-Identifier: GPL-3.0-or-later
#
# REUSE (https://reuse.software) metadata for files that cannot carry an SPDX header.
# Check with: reuse lint
version = 1

[[annotations]]
path = [
    "NOTICE",
    ".mvn/jvm.config",
    ".mvn/maven.config",
    ".mvn/wrapper/maven-wrapper.properties",
    "**/META-INF/services/**",
    "**/META-INF/native-image/**",
    "**/src/test/resources/**",
    "branding/**",
    "packaging/**/*.png",
    "packaging/**/*.ico",
    "packaging/**/*.icns",
    "njmule-gui/native/*.args",
    "njmule-gui/native/**/*.json",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Salvatore Coppola and the njMule contributors"
SPDX-License-Identifier = "GPL-3.0-or-later"

# Maven Wrapper scripts, generated by the Apache Maven Wrapper plugin.
[[annotations]]
path = ["mvnw", "mvnw.cmd"]
precedence = "override"
SPDX-FileCopyrightText = "The Apache Software Foundation"
SPDX-License-Identifier = "Apache-2.0"

# The server list and Kad contacts a new profile starts from, downloaded unchanged on 15 October
# 2026 from http://upd.emule-security.org/server.met and /nodes.dat: public addresses, ports and
# server names, facts not covered by copyright.
[[annotations]]
path = [
    "njmule-core/src/main/resources/org/njmule/core/engine/server.met",
    "njmule-core/src/main/resources/org/njmule/core/engine/nodes.dat",
]
precedence = "override"
SPDX-FileCopyrightText = "NONE"
SPDX-License-Identifier = "CC0-1.0"
