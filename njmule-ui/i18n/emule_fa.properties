IDS_FIRSTAUTOUP=اگر مي خواهيد ايمول كنترل اولويتهاي فايلهاي آپلودي شما را بر عهده بگيرد اين گزينه را فعال كنيد.َ\n\n اگر اين گزينه را فعال كنيد سرعت دريافت  فايل زياد مي شود ولي  فايلهايي كه با تعداد بالاي درخواست مواجه هستند با مشكل صف طولاني مواجه مي شوند و جابجايي در صف كند ميشود  . پس فايلهايي كه با تعداد منابع كم روبرو هستند با اين گزينه بهتر كار ميكنند. اين گزينه فقط به فايلهاي اشتراكي كه بعدا اضافه مي كنيد اعمال ميشود.َ
IDS_FIRSTCOMPLETE=شما تنظيمات سريع اوليه را با موفقيت به اتمام رسانديد.\n\nتمام اين تنظيمات وگزينه هاي بيشتر را مي توانيد در تنظيمات اصلي ايمول پيدا كنيد. براي آموزش و تشريح بيشتر و ديدن كتاب راهنما كليد اف يك را فشار دهيد!َ
IDS_FIRSTSAFECON=اگر مي خواهيد كه ايمول در حالت امن و مطمئن اتصال پيدا كند اين گزينه را فعال كنيد.َ\n\nفعال كردن اين گزينه باعث ميشود كه با سرعت بيشتري به سرويس دهنده وصل شويد , ولي ممكن است باعث شود سرويس دهنده به اشتباه شما را كاربر سطح پايين شناسايي كند.
