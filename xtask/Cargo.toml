[package]
name = "xtask"
version = "0.0.0"
description = "Cargo build tasks for njMule (UI, desktop shell, Windows service host, website, release tools)"
license = "GPL-3.0-or-later"
edition = "2024"
rust-version = "1.99"
publish = false

[dependencies]
data-encoding = "2.11.1"
encoding_rs = "0.8.44"
jiff = "1.0.1"
serde_json = "1.0.154"
sha2 = "0.11.1"

[lints.rust]
unsafe_code = "forbid"
